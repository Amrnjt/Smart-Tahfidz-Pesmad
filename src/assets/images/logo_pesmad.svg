<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <!-- ISLAMIC GEOMETRIC EMBLEM: 8-POINTED STAR (RUB EL HIZB) + CRESCENT MOON + OPEN HOLY QUR'AN -->
  <!-- Colors: Gold (#C8A86B / #C5A059), Warm Mocha/Brown (#6A4E3E / #634737), Pure White (#FFFFFF) -->
  
  <defs>
    <!-- Subtle smooth styling -->
    <style>
      .gold-stroke { stroke: #C8A86B; stroke-width: 14; stroke-linejoin: round; stroke-linecap: round; fill: none; }
      .gold-fill { fill: #C8A86B; }
      .brown-fill { fill: #6A4E3E; }
      .brown-stroke { stroke: #6A4E3E; stroke-linejoin: round; stroke-linecap: round; }
    </style>
  </defs>

  <!-- 1. OUTER ACCENT GEOMETRIC DOTS (RADIAL ACCENTS) -->
  <g fill="#C8A86B">
    <!-- Top cardinal dots -->
    <circle cx="250" cy="18" r="4.5" />
    <circle cx="250" cy="30" r="3" />

    <!-- Bottom cardinal dots -->
    <circle cx="250" cy="482" r="4.5" />
    <circle cx="250" cy="470" r="3" />

    <!-- Left cardinal dots -->
    <circle cx="18" cy="250" r="4.5" />
    <circle cx="30" cy="250" r="3" />
    <circle cx="40" cy="250" r="2" />

    <!-- Right cardinal dots -->
    <circle cx="482" cy="250" r="4.5" />
    <circle cx="470" cy="250" r="3" />
    <circle cx="460" cy="250" r="2" />

    <!-- 4 Diagonals Accent Dots -->
    <!-- Top-Left -->
    <circle cx="95" cy="85" r="4" />
    <circle cx="85" cy="95" r="3" />

    <!-- Top-Right -->
    <circle cx="405" cy="85" r="4" />
    <circle cx="415" cy="95" r="3" />

    <!-- Bottom-Left -->
    <circle cx="95" cy="415" r="4" />
    <circle cx="85" cy="405" r="3" />

    <!-- Bottom-Right -->
    <circle cx="405" cy="415" r="4" />
    <circle cx="415" cy="405" r="3" />
  </g>

  <!-- 2. ISLAMIC 8-POINTED STAR (RUB EL HIZB - TWO OVERLAPPING SQUARES) -->
  <!-- Diamond Square (Rotated 45 deg) -->
  <rect
    x="95"
    y="95"
    width="310"
    height="310"
    rx="6"
    class="gold-stroke"
    transform="rotate(45 250 250)"
  />

  <!-- Straight Square (0 deg) -->
  <rect
    x="95"
    y="95"
    width="310"
    height="310"
    rx="6"
    class="gold-stroke"
  />

  <!-- 3. INNER ORNATE SCALLOPED ARABESQUE FRAME (LENGKUNG KUBAH / KELOPAK EMAS) -->
  <g stroke="#C8A86B" stroke-width="12" fill="none" stroke-linejoin="round" stroke-linecap="round">
    <!-- Top Arch & Scallops -->
    <path d="M 158 158 C 175 118 210 95 250 95 C 290 95 325 118 342 158" />
    
    <!-- Top Tri-lobe / Pointed Arch detail in Gold -->
    <path d="M 195 160 C 190 125 218 105 250 105 C 282 105 310 125 305 160" stroke-width="8" />

    <!-- Side Cusps -->
    <path d="M 342 158 C 382 175 405 210 405 250 C 405 290 382 325 342 342" />
    <path d="M 342 342 C 325 382 290 405 250 405 C 210 405 175 382 158 342" />
    <path d="M 158 342 C 118 325 95 290 95 250 C 95 210 118 175 158 158" />

    <!-- Inner Arabesque Petal Petioles -->
    <path d="M 215 152 C 228 135 240 128 250 128 C 260 128 272 135 285 152" stroke-width="9" />
    <path d="M 348 215 C 365 228 372 240 372 250 C 372 260 365 272 348 285" stroke-width="9" />
    <path d="M 285 348 C 272 365 260 372 250 372 C 240 372 228 365 215 348" stroke-width="9" />
    <path d="M 152 285 C 135 272 128 260 128 250 C 128 240 135 228 152 215" stroke-width="9" />
  </g>

  <!-- 4. CRESCENT MOON (BULAN SABIT COKELAT) AT TOP-CENTER -->
  <path
    d="M 250 142
       C 263 142 274 153 274 167
       C 274 181 263 192 250 192
       C 238 192 228 183 226 172
       C 230 176 236 179 243 179
       C 253 179 261 171 261 161
       C 261 154 256 148 249 145
       C 249.4 144 249.7 142 250 142 Z"
    fill="#6A4E3E"
  />

  <!-- 5. OPEN HOLY QUR'AN / MUSHAF (KITAB SUCI AL-QUR'AN TERBUKA) -->
  <g transform="translate(0, 30)">
    <!-- Outer Base Cover Outline (Thick Dark Mocha Brown) -->
    <path
      d="M 250 258
         C 200 236 145 240 102 268
         L 90 300
         C 142 274 200 270 245 292
         L 250 294
         L 255 292
         C 300 270 358 274 410 300
         L 398 268
         C 355 240 300 236 250 258 Z"
      fill="#6A4E3E"
      stroke="#6A4E3E"
      stroke-width="5"
      stroke-linejoin="round"
    />

    <!-- Bottom Spine Thickness / Book Base Profile -->
    <path
      d="M 90 300
         C 142 274 200 270 245 292
         L 250 298
         L 255 292
         C 300 270 358 274 410 300
         L 404 314
         C 354 286 298 282 255 304
         L 250 306
         L 245 304
         C 202 282 146 286 96 314
         Z"
      fill="#6A4E3E"
    />

    <!-- LEFT PAGE (WHITE SPREAD WITH BROWN BORDER) -->
    <path
      d="M 245 186
         C 198 174 150 178 114 205
         L 108 266
         C 148 240 196 236 244 256
         Z"
      fill="#FFFFFF"
      stroke="#6A4E3E"
      stroke-width="8.5"
      stroke-linejoin="round"
    />

    <!-- Left Page Inner Margin Detail Line -->
    <path
      d="M 235 198
         C 198 188 158 192 128 214
         L 124 254
         C 154 235 194 232 234 248
         Z"
      fill="#FFFFFF"
      stroke="#6A4E3E"
      stroke-width="3"
      stroke-linejoin="round"
    />

    <!-- RIGHT PAGE (WHITE SPREAD WITH BROWN BORDER) -->
    <path
      d="M 255 186
         C 302 174 350 178 386 205
         L 392 266
         C 352 240 304 236 256 256
         Z"
      fill="#FFFFFF"
      stroke="#6A4E3E"
      stroke-width="8.5"
      stroke-linejoin="round"
    />

    <!-- Right Page Inner Margin Detail Line -->
    <path
      d="M 265 198
         C 302 188 342 192 372 214
         L 376 254
         C 346 235 306 232 266 248
         Z"
      fill="#FFFFFF"
      stroke="#6A4E3E"
      stroke-width="3"
      stroke-linejoin="round"
    />

    <!-- Center Binding Spine Channel (Celah Poros Kitab) -->
    <path
      d="M 245 186
         L 255 186
         L 255 258
         L 245 258
         Z"
      fill="#6A4E3E"
    />
  </g>
</svg>
