name: Dashboard Visual Polish II Validation

on:
  push:
    branches:
      - dashboard-visual-polish-ii
    paths:
      - .github/workflows/dashboard-visual-polish-ii.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dashboard-visual-polish-ii
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Apply Visual Polish II
        run: python scripts/dashboard_visual_polish_ii.py

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: TypeScript check
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Visual Polish II finish gate
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('src/components/UstadzDashboard.tsx').read_text()
          assert 'latestTodayActivity' in text
          assert 'dailyBreakdownWithShare' in text
          assert 'style={{ width: `${item.share}%` }}' in text
          assert 'Terakhir hari ini' in text
          assert "aria-label={`${record.namaSantri}, ${record.category}, ${record.nilai}. Buka riwayat`}" in text
          assert "onClick={() => setActiveTab('riwayat')}" in text
          assert 'bg-gradient' not in text
          assert 'backdrop-blur' not in text
          assert 'Sparkles' not in text
          for token in ['text-[9px]', 'text-[10px]', 'text-[11px]']:
              assert token not in text
          PY
          git diff --check

      - name: Commit verified dashboard source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/UstadzDashboard.tsx
          git commit -m "refactor: apply Ustadz dashboard visual polish II"
          git push origin HEAD:dashboard-visual-polish-ii
