name: P3 Release Polish Gate

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/release-polish.css'
      - 'src/App.tsx'
      - 'src/components/Navbar.tsx'
      - 'src/components/DesktopPrimaryNav.tsx'
      - 'src/components/SantriManagement.tsx'
      - 'src/components/KelasManagement.tsx'
      - 'src/components/MushafQuran.tsx'
      - 'src/main.tsx'
      - '.github/workflows/p3-release-polish.yml'
  push:
    branches:
      - 'polish/p3-*'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: TypeScript check
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Verify P3 surface contract
        run: |
          grep -q "import './release-polish.css'" src/main.tsx
          grep -q 'p3-management-page p3-santri-management' src/components/SantriManagement.tsx
          grep -q 'p3-management-page p3-kelas-management' src/components/KelasManagement.tsx
          grep -q 'p3-mushaf-page' src/components/MushafQuran.tsx
          grep -q 'prefers-reduced-motion: reduce' src/release-polish.css
          grep -q 'forced-colors: active' src/release-polish.css
          grep -q 'content-visibility: auto' src/release-polish.css
          grep -q 'night-mode-active' src/release-polish.css

      - name: Verify persistent chrome contract
        run: |
          grep -q 'p3-chrome-stack' src/App.tsx
          grep -q 'DesktopPrimaryNav' src/App.tsx
          grep -q 'data-app-chrome="primary-navigation"' src/components/DesktopPrimaryNav.tsx
          grep -q 'p2-topbar ui-safe-top relative select-none' src/components/Navbar.tsx
          grep -q 'position: sticky' src/release-polish.css
          grep -q 'p3-primary-nav-layer' src/release-polish.css
          if grep -A120 'Main Container' src/App.tsx | grep -q 'aria-label="Navigasi utama"'; then
            echo 'Desktop primary navigation must stay outside main page transitions.'
            exit 1
          fi

      - name: Enforce P3 performance budget
        run: |
          size=$(wc -c < src/release-polish.css)
          echo "release-polish.css bytes: $size"
          test "$size" -le 24000
          if grep -Eq 'backdrop-filter|animation-iteration-count:[[:space:]]*infinite|filter:[[:space:]]*blur' src/release-polish.css; then
            echo 'P3 release polish contains an expensive global effect.'
            exit 1
          fi
