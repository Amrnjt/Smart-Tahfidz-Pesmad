name: P3 Release Polish Gate

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/release-polish.css'
      - 'src/responsive-accessibility.css'
      - 'src/santri-experience-finish.css'
      - 'src/chrome-transition-fix.css'
      - 'src/ustadz-experience-finish.css'
      - 'src/App.tsx'
      - 'src/components/Navbar.tsx'
      - 'src/components/DesktopPrimaryNav.tsx'
      - 'src/components/SantriManagement.tsx'
      - 'src/components/KelasManagement.tsx'
      - 'src/components/MushafQuran.tsx'
      - 'src/components/WaliDashboard.tsx'
      - 'src/components/SantriDashboard.tsx'
      - 'src/components/UstadzDashboard.tsx'
      - 'src/main.tsx'
      - '.github/workflows/p3-release-polish.yml'
  push:
    branches:
      - 'polish/p3-*'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: TypeScript check
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Verify P3 surface contract
        run: |
          grep -q "import './release-polish.css'" src/main.tsx
          grep -q 'p3-management-page p3-santri-management' src/components/SantriManagement.tsx
          grep -q 'p3-management-page p3-kelas-management' src/components/KelasManagement.tsx
          grep -q 'p3-mushaf-page' src/components/MushafQuran.tsx
          grep -q 'prefers-reduced-motion: reduce' src/release-polish.css
          grep -q 'forced-colors: active' src/release-polish.css
          grep -q 'content-visibility: auto' src/release-polish.css
          grep -q 'night-mode-active' src/release-polish.css

      - name: Verify persistent chrome contract
        run: |
          grep -q 'p3-chrome-stack' src/App.tsx
          grep -q 'DesktopPrimaryNav' src/App.tsx
          grep -q 'data-app-chrome="primary-navigation"' src/components/DesktopPrimaryNav.tsx
          grep -q 'p2-topbar ui-safe-top relative select-none' src/components/Navbar.tsx
          grep -q 'position: sticky' src/release-polish.css
          grep -q 'p3-primary-nav-layer' src/release-polish.css
          if grep -A120 'Main Container' src/App.tsx | grep -q 'aria-label="Navigasi utama"'; then
            echo 'Desktop primary navigation must stay outside main page transitions.'
            exit 1
          fi

      - name: Verify navbar transition layering
        run: |
          grep -q "import './chrome-transition-fix.css'" src/main.tsx
          grep -q 'view-transition-name: p3-app-chrome' src/chrome-transition-fix.css
          grep -q 'view-transition-group(p3-app-chrome)' src/chrome-transition-fix.css
          grep -q 'z-index: 300' src/chrome-transition-fix.css
          grep -q 'view-transition-group(p2-nav-active)' src/chrome-transition-fix.css
          grep -q 'z-index: 320' src/chrome-transition-fix.css
          grep -q 'chrome-page-in' src/chrome-transition-fix.css
          grep -q 'chrome-page-out' src/chrome-transition-fix.css
          grep -q '@media (prefers-reduced-motion: reduce)' src/chrome-transition-fix.css
          grep -q '@media (forced-colors: active)' src/chrome-transition-fix.css

      - name: Verify responsive accessibility contract
        run: |
          grep -q "import './responsive-accessibility.css'" src/main.tsx
          grep -q "padding-bottom: calc(7rem + var(--safe-bottom))" src/responsive-accessibility.css
          grep -q 'font-size: 16px !important' src/responsive-accessibility.css
          grep -q '@media (max-width: 389px)' src/responsive-accessibility.css
          grep -q '@media (min-width: 768px) and (max-height: 520px)' src/responsive-accessibility.css
          grep -q '@media (max-height: 560px)' src/responsive-accessibility.css
          grep -q 'scroll-margin-top' src/responsive-accessibility.css
          grep -q 'prefers-reduced-motion: reduce' src/responsive-accessibility.css
          grep -q 'forced-colors: active' src/responsive-accessibility.css

      - name: Verify P3.2.1 Wali experience contract
        run: |
          grep -q 'p3-wali-page' src/components/WaliDashboard.tsx
          grep -q 'p321-parent-hero' src/components/WaliDashboard.tsx
          grep -q 'getRecencyInfo' src/components/WaliDashboard.tsx
          grep -q 'programLiburanActive' src/components/WaliDashboard.tsx
          grep -q 'p321-deferred-surface' src/components/WaliDashboard.tsx
          grep -q 'p3-wali-page' src/release-polish.css
          grep -q 'p321-surface-secondary' src/release-polish.css
          grep -q 'p321-surface-tertiary' src/release-polish.css
          grep -q '@media (max-width: 767px) and (pointer: coarse)' src/release-polish.css
          grep -q '@media (prefers-reduced-motion: reduce)' src/release-polish.css
          grep -q '@media (forced-colors: active)' src/release-polish.css

      - name: Verify P3.2.2 Santri experience contract
        run: |
          grep -q "import './santri-experience-finish.css'" src/main.tsx
          grep -q 'p3-santri-page' src/components/SantriDashboard.tsx
          grep -q 'p322-study-hero' src/components/SantriDashboard.tsx
          grep -q 'getRecencyInfo' src/components/SantriDashboard.tsx
          grep -q 'primaryAction' src/components/SantriDashboard.tsx
          grep -q 'santri-feedback-terbaru' src/components/SantriDashboard.tsx
          grep -q 'p322-deferred-surface' src/components/SantriDashboard.tsx
          grep -q 'bukan estimasi progres' src/components/SantriDashboard.tsx
          grep -q 'p3-santri-page' src/santri-experience-finish.css
          grep -q 'p322-surface-secondary' src/santri-experience-finish.css
          grep -q 'p322-surface-tertiary' src/santri-experience-finish.css
          grep -q 'content-visibility: auto' src/santri-experience-finish.css
          grep -q '@media (max-width: 767px) and (pointer: coarse)' src/santri-experience-finish.css
          grep -q '@media (prefers-reduced-motion: reduce)' src/santri-experience-finish.css
          grep -q '@media (forced-colors: active)' src/santri-experience-finish.css
          if grep -Eq 'position:[[:space:]]*sticky' src/santri-experience-finish.css; then
            echo 'Santri finish layer must not create competing sticky chrome.'
            exit 1
          fi

      - name: Verify P3.2.3 Ustadz experience contract
        run: |
          grep -q "import './ustadz-experience-finish.css'" src/main.tsx
          grep -q 'p3-ustadz-page' src/components/UstadzDashboard.tsx
          grep -q 'p323-operator-hero' src/components/UstadzDashboard.tsx
          grep -q 'getRecencyInfo' src/components/UstadzDashboard.tsx
          grep -q 'operatorAction' src/components/UstadzDashboard.tsx
          grep -q 'ustadz-tindak-lanjut' src/components/UstadzDashboard.tsx
          grep -q 'p323-deferred-surface' src/components/UstadzDashboard.tsx
          grep -q 'data setoran aktual' src/components/UstadzDashboard.tsx
          grep -q 'p3-ustadz-page' src/ustadz-experience-finish.css
          grep -q 'p323-surface-secondary' src/ustadz-experience-finish.css
          grep -q 'p323-surface-tertiary' src/ustadz-experience-finish.css
          grep -q 'content-visibility: visible' src/ustadz-experience-finish.css
          grep -q 'recharts-responsive-container' src/ustadz-experience-finish.css
          grep -q 'min-height: 240px' src/ustadz-experience-finish.css
          grep -q '@media (max-width: 767px) and (pointer: coarse)' src/ustadz-experience-finish.css
          grep -q '@media (prefers-reduced-motion: reduce)' src/ustadz-experience-finish.css
          grep -q '@media (forced-colors: active)' src/ustadz-experience-finish.css
          if grep -Eq '^[[:space:]]*content-visibility:[[:space:]]*auto[[:space:]]*;' src/ustadz-experience-finish.css; then
            echo 'Ustadz analytics must stay measurable; content-visibility:auto can blank Recharts.'
            exit 1
          fi
          if grep -Eq 'position:[[:space:]]*sticky' src/ustadz-experience-finish.css; then
            echo 'Ustadz finish layer must not create competing sticky chrome.'
            exit 1
          fi

      - name: Enforce P3 performance budget
        run: |
          release_size=$(wc -c < src/release-polish.css)
          responsive_size=$(wc -c < src/responsive-accessibility.css)
          santri_size=$(wc -c < src/santri-experience-finish.css)
          chrome_transition_size=$(wc -c < src/chrome-transition-fix.css)
          ustadz_size=$(wc -c < src/ustadz-experience-finish.css)
          echo "release-polish.css bytes: $release_size"
          echo "responsive-accessibility.css bytes: $responsive_size"
          echo "santri-experience-finish.css bytes: $santri_size"
          echo "chrome-transition-fix.css bytes: $chrome_transition_size"
          echo "ustadz-experience-finish.css bytes: $ustadz_size"
          test "$release_size" -le 24000
          test "$responsive_size" -le 14000
          test "$santri_size" -le 9000
          test "$chrome_transition_size" -le 6000
          test "$ustadz_size" -le 8000
          if grep -Eq 'backdrop-filter|animation-iteration-count:[[:space:]]*infinite|filter:[[:space:]]*blur' src/release-polish.css src/responsive-accessibility.css src/santri-experience-finish.css src/chrome-transition-fix.css src/ustadz-experience-finish.css; then
            echo 'P3 polish contains an expensive global effect.'
            exit 1
          fi
