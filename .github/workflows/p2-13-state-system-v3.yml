name: P2.13 State System Validation v3

on:
  push:
    branches:
      - p2-13-state-system
    paths:
      - .github/workflows/p2-13-state-system-v3.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: p2-13-state-system
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Apply P2.13 state system
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=None):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'Pattern not found in {path}: {old[:180]!r}')
              text = text.replace(old, new) if count is None else text.replace(old, new, count)
              p.write_text(text)

          # App: local cache renders immediately; manual Cloud verification owns sync state.
          path = 'src/App.tsx'
          replace(path,
              "  const [isLoadingData, setIsLoadingData] = useState<boolean>(false);\n  const [isSyncing, setIsSyncing] = useState<boolean>(false);",
              "  const [syncState, setSyncState] = useState<'idle' | 'syncing' | 'success' | 'error'>('idle');\n  const isSyncing = syncState === 'syncing';")
          replace(path, "    setIsSyncing(true);", "    setSyncState('syncing');")
          replace(path,
              "      refreshData();\n      setSnack({\n        id: `sync-${Date.now()}`",
              "      refreshData();\n      setSyncState('success');\n      setSnack({\n        id: `sync-${Date.now()}`")
          replace(path,
              "      console.error(err);\n      refreshData();\n      setSnack({",
              "      console.error(err);\n      refreshData();\n      setSyncState('error');\n      setSnack({")
          replace(path,
              "    } finally {\n      setIsSyncing(false);\n    }",
              "    }")
          replace(path, "                  isLoading={isLoadingData}\n", "")
          replace(path, "                isLoading={isLoadingData}\n", "")

          anchor = "  const isSetorActive = ['ziyadah', 'murojaah', 'binnadzor', 'pembelajaran'].includes(activeTab);\n"
          addition = anchor + "\n  const syncStatusCopy =\n    syncState === 'syncing'\n      ? 'Memeriksa koneksi dan data Cloud...'\n      : syncState === 'success'\n      ? 'Cloud Firestore • sinkronisasi terakhir berhasil'\n      : syncState === 'error'\n      ? 'Cloud tidak terjangkau • cache lokal tetap tersedia'\n      : 'Cloud Firestore • status koneksi belum diverifikasi';\n  const syncStatusTone =\n    syncState === 'success'\n      ? 'ui-state-success'\n      : syncState === 'error'\n      ? 'ui-state-error'\n      : syncState === 'syncing'\n      ? 'ui-state-info'\n      : 'ui-state-neutral';\n"
          replace(path, anchor, addition, 1)

          old_footer = '''                <div className="flex items-center gap-1.5 text-emerald-800 bg-emerald-50 px-2.5 py-1 rounded-full border border-emerald-200 text-[11px] font-semibold">
                  <Cloud className="w-3.5 h-3.5 text-emerald-700" />
                  <span>Cloud Firestore • Sinkronisasi Real-Time Multi-Device</span>
                </div>'''
          new_footer = '''                <div
                  role="status"
                  aria-live="polite"
                  aria-atomic="true"
                  className={`ui-state-surface flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-semibold ${syncStatusTone}`}
                >
                  <Cloud className={`w-3.5 h-3.5 ${syncState === 'syncing' ? 'animate-pulse' : ''}`} aria-hidden="true" />
                  <span>{syncStatusCopy}</span>
                </div>'''
          replace(path, old_footer, new_footer, 1)

          # Remove unreachable blocking skeleton state from local-first surfaces.
          path = 'src/components/UstadzDashboard.tsx'
          replace(path, "import { DashboardSkeleton } from './SkeletonLoading';\n", "")
          replace(path, "  isLoading?: boolean;\n", "")
          replace(path, "  onOpenSetorMenu,\n  isLoading = false\n}) => {", "  onOpenSetorMenu\n}) => {")
          replace(path, "\n  if (isLoading) {\n    return <DashboardSkeleton />;\n  }\n", "\n")

          path = 'src/components/WaliDashboard.tsx'
          replace(path, "import { SantriWaliDashboardSkeleton } from './SkeletonLoading';\n", "")
          replace(path, "  isLoading?: boolean;\n", "")
          replace(path, "  setActiveTab,\n  isLoading = false,\n  onNotify\n}) => {", "  setActiveTab,\n  onNotify\n}) => {")
          replace(path, "\n  if (isLoading) {\n    return <SantriWaliDashboardSkeleton role=\"Wali\" />;\n  }\n", "\n")

          path = 'src/components/SantriDashboard.tsx'
          replace(path, "import { SantriWaliDashboardSkeleton } from './SkeletonLoading';\n", "")
          replace(path, "  isLoading?: boolean;\n", "")
          replace(path, "  setActiveTab,\n  isLoading = false\n}) => {", "  setActiveTab\n}) => {")
          replace(path, "\n  if (isLoading) {\n    return <SantriWaliDashboardSkeleton role=\"Santri\" />;\n  }\n", "\n")

          path = 'src/components/HistoryTable.tsx'
          replace(path, "import { TableSkeleton } from './SkeletonLoading';\n", "")
          replace(path, "  isLoading?: boolean;\n", "")
          replace(path,
              "  currentUser, ziyadahRecords, murojaahRecords, binnadzorRecords, pembelajaranRecords, onDataChanged, isLoading = false, santriList = [], onNotify\n}) => {",
              "  currentUser, ziyadahRecords, murojaahRecords, binnadzorRecords, pembelajaranRecords, onDataChanged, santriList = [], onNotify\n}) => {")
          replace(path, "\n  if (isLoading) return <TableSkeleton rows={7} />;\n", "\n")

          # Snackbar: preserve API/behavior, strengthen state semantics and touch targets.
          path = 'src/components/Snackbar.tsx'
          replace(path,
              "    const timer = setTimeout(dismiss, duration);",
              "    const effectiveDuration = snack.type === 'error' || snack.actionLabel ? Math.max(duration, 7000) : duration;\n    const timer = setTimeout(dismiss, effectiveDuration);")
          replace(path,
              'fixed bottom-20 md:bottom-6 left-1/2 -translate-x-1/2 z-[70] w-[calc(100%-2rem)] max-w-md',
              'fixed bottom-20 md:bottom-6 left-1/2 -translate-x-1/2 z-[70] w-[calc(100%-2rem)] max-w-lg pointer-events-none')
          replace(path,
              '''      <div
        className={`flex items-center gap-3 px-4 py-3.5 rounded-2xl shadow-xl border ${''',
              '''      <div
        role={snack.type === 'error' ? 'alert' : 'status'}
        aria-live={snack.type === 'error' ? 'assertive' : 'polite'}
        aria-atomic="true"
        className={`ui-state-surface pointer-events-auto flex items-center gap-3 px-3 py-2 rounded-xl shadow-lg ${''')
          replace(path, "'bg-emerald-800 text-white border-emerald-700'", "'ui-state-success'")
          replace(path, "'bg-rose-800 text-white border-rose-700'", "'ui-state-error'")
          replace(path, "'bg-slate-800 text-white border-slate-700'", "'ui-state-info'")
          replace(path, 'w-5 h-5 text-emerald-200 flex-shrink-0', 'w-5 h-5 text-emerald-700 flex-shrink-0')
          replace(path, 'w-5 h-5 text-rose-200 flex-shrink-0', 'w-5 h-5 text-rose-700 flex-shrink-0')
          replace(path, 'w-5 h-5 text-slate-200 flex-shrink-0', 'w-5 h-5 text-sky-700 flex-shrink-0')
          replace(path, 'text-sm font-semibold flex-1', 'text-sm font-medium leading-5 flex-1')
          replace(path,
              'text-xs font-bold text-amber-300 hover:text-amber-200 transition cursor-pointer px-2 py-1 rounded-lg hover:bg-white/10',
              'min-h-11 px-3 rounded-lg border border-current/20 bg-white/70 text-sm font-semibold hover:bg-white transition-colors cursor-pointer flex-shrink-0')
          replace(path,
              'text-white/60 hover:text-white transition cursor-pointer p-0.5',
              'min-h-11 min-w-11 inline-flex items-center justify-center rounded-lg hover:bg-white/70 transition-colors cursor-pointer flex-shrink-0')
          replace(path, 'aria-label="Tutup"', 'aria-label="Tutup pemberitahuan"')

          # Wali setoran toast: actual timestamp, calm surface, accessible dismissal.
          path = 'src/components/NotificationToastContainer.tsx'
          replace(path,
              "import { BookOpen, RotateCw, X, Bell } from 'lucide-react';",
              "import { BookOpen, RotateCw, X, Bell } from 'lucide-react';\nimport { formatTanggalLengkap } from '../utils/dateFormatter';")
          replace(path,
              'fixed top-4 right-4 z-[60] flex flex-col gap-3 max-w-sm w-[calc(100%-2rem)] sm:w-96',
              'fixed top-4 right-4 z-[60] flex flex-col gap-3 max-w-sm w-[calc(100%-2rem)] sm:w-96')
          replace(path,
              '''  return (
    <div className="fixed top-4 right-4 z-[60] flex flex-col gap-3 max-w-sm w-[calc(100%-2rem)] sm:w-96">''',
              '''  return (
    <div
      className="fixed top-4 right-4 z-[60] flex flex-col gap-3 max-w-sm w-[calc(100%-2rem)] sm:w-96"
      aria-live="polite"
      aria-relevant="additions"
    >''')
          replace(path,
              'bg-white rounded-2xl shadow-xl border border-emerald-200 overflow-hidden animate-in slide-in-from-right duration-300',
              'bg-white rounded-xl shadow-lg border border-slate-200 overflow-hidden')
          replace(path,
              'flex items-center justify-between px-4 py-2.5 bg-gradient-to-r from-emerald-800 to-teal-800 text-white',
              'flex items-center justify-between px-4 py-3 border-b border-slate-200 bg-white text-slate-900')
          replace(path, 'Bell className="w-4 h-4 text-amber-300"', 'Bell className="w-4 h-4 text-slate-600"')
          replace(path, 'text-xs font-bold">Notifikasi Setoran Baru', 'text-xs font-semibold">Notifikasi Setoran Baru')
          replace(path,
              'text-white/70 hover:text-white transition cursor-pointer p-0.5',
              'min-h-11 min-w-11 inline-flex items-center justify-center rounded-lg text-slate-500 hover:bg-slate-100 hover:text-slate-800 transition-colors cursor-pointer')
          replace(path,
              '''                <p className="text-[11px] text-slate-500 mt-0.5">
                  Diterima 10 menit yang lalu
                </p>''',
              '''                <p className="text-xs text-slate-500 mt-0.5">
                  Waktu setoran: {formatTanggalLengkap(toast.data.timestamp)}
                </p>''')
          replace(path,
              'bg-slate-50 rounded-xl p-3 border border-slate-100 space-y-1.5 text-xs',
              'bg-slate-50 rounded-xl p-3 border border-slate-200 space-y-1.5 text-sm')
          replace(path,
              'key={toast.id}\n          className=',
              'key={toast.id}\n          role="status"\n          className=', 1)

          # Semantic state helpers complete P2.1 contract.
          path = 'src/index.css'
          marker = '''.ui-state-info {
  color: var(--status-info);
  background: var(--status-info-subtle);
  border-color: color-mix(in srgb, var(--status-info) 25%, white);
}
'''
          addition = marker + '''
.ui-state-neutral {
  color: var(--status-neutral);
  background: var(--status-neutral-subtle);
  border-color: color-mix(in srgb, var(--status-neutral) 22%, white);
}

.ui-state-surface {
  border-width: 1px;
  border-style: solid;
  border-radius: var(--radius-surface);
}
'''
          replace(path, marker, addition, 1)

          skeleton = Path('src/components/SkeletonLoading.tsx')
          if not skeleton.exists():
              raise SystemExit('SkeletonLoading.tsx missing before cleanup')
          skeleton.unlink()
          PY

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: TypeScript check
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: P2.13 finish gate
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          app = Path('src/App.tsx').read_text()
          snack = Path('src/components/Snackbar.tsx').read_text()
          toast = Path('src/components/NotificationToastContainer.tsx').read_text()
          css = Path('src/index.css').read_text()
          dashboards = [
              Path('src/components/UstadzDashboard.tsx').read_text(),
              Path('src/components/WaliDashboard.tsx').read_text(),
              Path('src/components/SantriDashboard.tsx').read_text(),
              Path('src/components/HistoryTable.tsx').read_text(),
          ]
          assert 'isLoadingData' not in app
          assert "syncState === 'syncing'" in app
          assert 'Cloud tidak terjangkau • cache lokal tetap tersedia' in app
          assert 'status koneksi belum diverifikasi' in app
          assert 'Sinkronisasi Real-Time Multi-Device' not in app
          assert "role={snack.type === 'error' ? 'alert' : 'status'}" in snack
          assert 'Math.max(duration, 7000)' in snack
          assert 'min-h-11 min-w-11' in snack
          assert 'Diterima 10 menit yang lalu' not in toast
          assert 'formatTanggalLengkap(toast.data.timestamp)' in toast
          assert 'aria-live="polite"' in toast
          assert 'bg-gradient' not in toast
          assert 'text-[11px]' not in toast
          assert '.ui-state-neutral' in css and '.ui-state-surface' in css
          assert not Path('src/components/SkeletonLoading.tsx').exists()
          for text in dashboards:
              assert 'SkeletonLoading' not in text
              assert 'isLoading?: boolean' not in text
              assert 'if (isLoading)' not in text
          PY
          if git grep -n "SkeletonLoading" -- src; then exit 1; fi
          git diff --check

      - name: Commit verified P2.13 source
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A src
          git commit -m "refactor: unify P2.13 application state system"
          git push origin HEAD:p2-13-state-system
