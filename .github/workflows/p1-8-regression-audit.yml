name: P1.8 Regression Audit

on:
  push:
    branches: [p1-8-regression]

jobs:
  regression-audit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: p1-8-regression
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply P1.8 fixes
        run: python .github/p1_8_patch.py
      - name: Install dependencies
        run: npm install --no-package-lock --ignore-scripts
      - name: TypeScript contract check
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: Static P1 regression contract
        shell: bash
        run: |
          set -euo pipefail
          grep -q "activeTab === 'ziyadah' && isUstadz" src/App.tsx
          grep -q "activeTab === 'riwayat'" src/App.tsx
          grep -q "activeTab === 'mushaf'" src/App.tsx
          grep -q "activeTab === 'santri' && isUstadz" src/App.tsx
          grep -q "activeTab === 'kelas' && isUstadz" src/App.tsx
          grep -q "safe-area-inset-bottom" src/components/BottomNav.tsx
          grep -q "max-h-\[88dvh\]" src/components/SetorActionSheet.tsx
          grep -q "useAccessibleDialog" src/components/HistoryTable.tsx
          grep -q "useAccessibleDialog" src/components/UnduhLaporanModal.tsx
          ! grep -R -nE '\b(window\.)?(alert|confirm)\s*\(' src/components
          grep -q "await storageService.saveZiyadah" src/components/ZiyadahForm.tsx
          grep -q "await storageService.saveMurojaah" src/components/MurojaahForm.tsx
          grep -q "await storageService.saveBinnadzor" src/components/BinnadzorForm.tsx
          grep -q "await storageService.savePembelajaran" src/components/PembelajaranForm.tsx
          grep -q "santriList={santriList}" src/components/BottomNav.tsx
          grep -q "onNotify={onNotify}" src/components/BottomNav.tsx
          ! grep -q "storageService" src/components/BottomNav.tsx
      - name: Diff check
        run: git diff --check
      - name: Commit verified regression fixes
        shell: bash
        run: |
          set -euo pipefail
          rm .github/p1_8_patch.py .github/workflows/p1-8-regression-audit.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx src/components/BottomNav.tsx .github/p1_8_patch.py .github/workflows/p1-8-regression-audit.yml
          git commit -m "fix: close P1.8 navigation regression"
          git push origin HEAD:p1-8-regression
