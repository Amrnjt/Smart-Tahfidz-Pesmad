name: P1.5 Santri Management IA

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/p1-5-santri-ia.yml

permissions:
  contents: write

jobs:
  patch-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Apply patch
        run: python3 .github/p1_5_patch.py

      - name: Validate build and IA scope
        run: |
          npm install --no-package-lock --ignore-scripts
          npm run build
          git diff --check
          ! grep -q 'PantauanLiburanMonitorModal' src/components/SantriManagement.tsx
          ! grep -q 'setProgramLiburanActive' src/components/SantriManagement.tsx
          grep -q 'Pantauan Liburan' src/components/SetorActionSheet.tsx
          git diff --name-only HEAD | grep -qx 'src/components/SantriManagement.tsx'

      - name: Commit verified change
        run: |
          rm .github/p1_5_patch.py
          rm .github/workflows/p1-5-santri-ia.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: simplify P1.5 Santri Management IA"
          git push origin HEAD:main
