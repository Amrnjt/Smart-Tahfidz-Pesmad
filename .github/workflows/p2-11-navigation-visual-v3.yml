name: P2.11 Navigation Visual Validation v3

on:
  push:
    branches:
      - p2-11-navigation-visual
    paths:
      - .github/workflows/p2-11-navigation-visual-v3.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: p2-11-navigation-visual
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Apply P2.11 navigation polish
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def replace(path, old, new, count=None):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'Pattern not found in {path}: {old[:140]!r}')
              text = text.replace(old, new) if count is None else text.replace(old, new, count)
              p.write_text(text)

          # Header / profile navigation.
          path = 'src/components/Navbar.tsx'
          replace(path,
              "import { LogOut, MapPin, RefreshCw, BookOpen, ChevronDown, UserCheck, Shield, Sparkles } from 'lucide-react';",
              "import { LogOut, MapPin, RefreshCw, BookOpen, ChevronDown } from 'lucide-react';")
          replace(path,
              "avatarBg: 'bg-gradient-to-tr from-amber-600 to-yellow-500 border-amber-300 text-slate-900 font-extrabold'",
              "avatarBg: 'bg-amber-500 border-amber-300 text-amber-950 font-extrabold'")
          replace(path,
              'sticky top-0 z-40 bg-emerald-900/95 backdrop-blur-md text-white shadow-sm border-b border-emerald-950/80 select-none',
              'sticky top-0 z-40 bg-emerald-950 text-white border-b border-emerald-900 select-none')
          replace(path,
              'max-w-7xl mx-auto px-3 sm:px-4 py-2 sm:py-2.5 flex items-center justify-between gap-2',
              'max-w-7xl mx-auto px-3 sm:px-6 min-h-16 flex items-center justify-between gap-3')
          replace(path,
              'ripple-container flex items-center space-x-2.5 sm:space-x-3 cursor-pointer group flex-1 min-w-0',
              'ripple-container flex min-h-11 items-center gap-3 cursor-pointer flex-1 min-w-0 rounded-xl focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-emerald-300 focus-visible:ring-offset-2 focus-visible:ring-offset-emerald-950')
          replace(path,
              'w-8 h-8 sm:w-10 sm:h-10 flex items-center justify-center flex-shrink-0 transition-transform duration-200 group-hover:scale-105',
              'w-9 h-9 sm:w-10 sm:h-10 flex items-center justify-center flex-shrink-0')
          replace(path,
              'text-xs sm:text-sm md:text-base font-bold tracking-tight text-white leading-tight truncate',
              'text-sm sm:text-base font-bold tracking-tight text-white leading-tight truncate')
          replace(path,
              'text-[9px] sm:text-[10px] font-extrabold px-1.5 py-0.5 rounded bg-emerald-800/90 text-emerald-200 border border-emerald-600/70 tracking-tight',
              'text-xs font-medium text-emerald-200')
          replace(path,
              'text-[10px] sm:text-xs text-emerald-300/80 font-medium hidden sm:flex items-center gap-1 mt-0.5 truncate',
              'text-xs text-emerald-200/80 font-medium hidden sm:flex items-center gap-1 mt-0.5 truncate')
          replace(path,
              'ripple-container press-feedback p-2 rounded-xl bg-emerald-950/70 text-emerald-200 border border-emerald-800/70 cursor-pointer flex items-center gap-1.5 text-xs font-semibold',
              'ripple-container press-feedback min-h-11 min-w-11 px-3 rounded-xl bg-emerald-900 text-emerald-100 border border-emerald-800 cursor-pointer flex items-center justify-center gap-2 text-xs font-semibold focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-emerald-300')
          replace(path,
              "isRefreshing ? 'opacity-70 cursor-not-allowed' : 'hover:bg-emerald-800/80 hover:text-white transition-colors'",
              "isRefreshing ? 'opacity-70 cursor-not-allowed' : 'hover:bg-emerald-800 hover:text-white transition-colors'")
          replace(path, 'hidden xl:inline text-[11px]', 'hidden xl:inline text-xs')
          replace(path,
              'flex items-center gap-2 py-1 pl-1.5 pr-2.5 rounded-xl bg-emerald-950/70 hover:bg-emerald-800/80 border border-emerald-800/70 text-white transition-all cursor-pointer group',
              'min-h-11 flex items-center gap-2 py-1 pl-1.5 pr-2.5 rounded-xl bg-emerald-900 hover:bg-emerald-800 border border-emerald-800 text-white transition-colors cursor-pointer focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-emerald-300')
          replace(path,
              'w-7 h-7 sm:w-8 sm:h-8 rounded-lg flex items-center justify-center font-extrabold text-[11px] sm:text-xs border shadow-xs',
              'w-8 h-8 rounded-lg flex items-center justify-center font-extrabold text-xs border')
          replace(path,
              'inline-block text-[9px] px-1.5 py-0.2 rounded border font-semibold mt-0.5',
              'inline-block text-xs px-1.5 py-0.5 rounded border font-semibold mt-0.5')
          replace(path,
              'absolute right-0 mt-2 w-64 bg-white rounded-2xl shadow-xl border border-slate-200 text-slate-800 py-2 z-50 animate-in fade-in slide-in-from-top-2 duration-150',
              'absolute right-0 mt-2 w-64 bg-white rounded-xl shadow-lg border border-slate-200 text-slate-800 py-2 z-50')
          replace(path, 'text-[11px] text-slate-500 font-mono truncate', 'text-xs text-slate-500 font-mono truncate')
          replace(path, 'inline-block text-[10px] px-2 py-0.5 rounded-md font-bold border', 'inline-block text-xs px-2 py-0.5 rounded-md font-semibold border')
          replace(path, "{normalizedRole === 'Ustadz' && '🛡️ Ustadz Musyrif'}", "{normalizedRole === 'Ustadz' && 'Ustadz Musyrif'}")
          replace(path, "{normalizedRole === 'Wali' && '👨‍👩‍👧 Wali Santri'}", "{normalizedRole === 'Wali' && 'Wali Santri'}")
          replace(path, "{normalizedRole === 'Santri' && '📖 Santri'}", "{normalizedRole === 'Santri' && 'Santri'}")
          replace(path, 'p-1.5 space-y-0.5 text-xs font-semibold', 'p-1.5 space-y-0.5 text-sm font-medium')
          replace(path,
              'w-full px-3 py-2 rounded-xl text-left flex items-center gap-2.5 text-slate-700 hover:bg-emerald-50 hover:text-emerald-800 transition-colors cursor-pointer',
              'w-full min-h-11 px-3 py-2 rounded-lg text-left flex items-center gap-2.5 text-slate-700 hover:bg-emerald-50 hover:text-emerald-800 transition-colors cursor-pointer focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-emerald-500')
          replace(path,
              'w-full px-3 py-2 rounded-xl text-left flex items-center gap-2.5 text-rose-600 hover:bg-rose-50 font-bold transition-colors cursor-pointer text-xs',
              'w-full min-h-11 px-3 py-2 rounded-lg text-left flex items-center gap-2.5 text-rose-700 hover:bg-rose-50 font-semibold transition-colors cursor-pointer text-sm focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-rose-500')
          replace(path,
              'hidden md:flex p-2 rounded-xl bg-emerald-950/70 hover:bg-rose-900/80 text-emerald-200 hover:text-rose-200 border border-emerald-800/70 transition-colors cursor-pointer',
              'hidden md:flex min-h-11 min-w-11 items-center justify-center rounded-xl bg-emerald-900 hover:bg-rose-900 text-emerald-100 hover:text-rose-100 border border-emerald-800 transition-colors cursor-pointer focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-rose-300')

          # Bottom navigation.
          path = 'src/components/BottomNav.tsx'
          replace(path,
              'md:hidden fixed bottom-0 left-0 right-0 z-40 bg-white/90 backdrop-blur-[18px] border-t border-slate-200/80 shadow-[0_-4px_20px_-2px_rgba(0,0,0,0.05)] px-2 pt-1 pb-[calc(0.5rem+env(safe-area-inset-bottom,0px))]',
              'md:hidden fixed bottom-0 left-0 right-0 z-40 bg-white border-t border-slate-200 px-1.5 pt-1.5 pb-[calc(0.5rem+env(safe-area-inset-bottom,0px))]')
          replace(path,
              'md:hidden fixed bottom-0 left-0 right-0 z-40 bg-white/90 backdrop-blur-[18px] border-t border-slate-200/80 shadow-[0_-4px_20px_-2px_rgba(0,0,0,0.05)] px-1 pt-1 pb-[calc(0.5rem+env(safe-area-inset-bottom,0px))]',
              'md:hidden fixed bottom-0 left-0 right-0 z-40 bg-white border-t border-slate-200 px-1 pt-1.5 pb-[calc(0.5rem+env(safe-area-inset-bottom,0px))]')
          replace(path,
              'press-feedback flex flex-col items-center justify-center py-1.5 px-3 rounded-xl transition-all duration-150 active:scale-[0.985]',
              'press-feedback min-h-14 flex flex-col items-center justify-center py-1.5 px-3 rounded-xl transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-emerald-500')
          replace(path, "isActive ? 'text-emerald-800 font-bold' : 'text-slate-500 font-medium'", "isActive ? 'text-emerald-900 font-semibold' : 'text-slate-500 font-medium'", 1)
          replace(path, "p-1 rounded-lg transition-colors ${isActive ? 'bg-emerald-100 text-emerald-800' : ''}", "p-1.5 rounded-lg transition-colors ${isActive ? 'bg-emerald-50 text-emerald-800' : 'text-slate-500'}", 1)
          replace(path, 'text-[10px] tracking-tight mt-0.5', 'text-xs tracking-tight mt-0.5', 1)
          replace(path, 'flex flex-col items-center justify-center relative -top-3.5 px-0.5', 'flex flex-col items-center justify-center relative -top-3 px-0.5')
          replace(path,
              'ripple-container relative w-12 h-12 rounded-2xl flex items-center justify-center text-white shadow-md transition-all duration-150 cursor-pointer active:scale-[0.985]',
              'ripple-container relative w-12 h-12 rounded-xl flex items-center justify-center text-white shadow-sm transition-colors cursor-pointer focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-emerald-500 focus-visible:ring-offset-2')
          replace(path, "'bg-gradient-to-tr from-emerald-700 to-teal-600 ring-4 ring-emerald-200/80 shadow-emerald-700/25'", "'bg-emerald-950'")
          replace(path, "'bg-gradient-to-tr from-emerald-800 to-emerald-600 hover:from-emerald-700 hover:to-emerald-500 shadow-emerald-900/25'", "'bg-emerald-800 hover:bg-emerald-700'")
          replace(path, 'text-[10px] tracking-tight font-bold mt-1', 'text-xs tracking-tight font-semibold mt-1')
          replace(path,
              'ripple-container press-feedback flex flex-col items-center justify-center py-1 px-1 rounded-xl transition-all duration-150 cursor-pointer min-w-0 w-full active:scale-[0.985]',
              'ripple-container press-feedback min-h-14 flex flex-col items-center justify-center py-1 px-1 rounded-xl transition-colors cursor-pointer min-w-0 w-full focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-emerald-500')
          replace(path, "isActive ? 'text-emerald-800 font-bold' : 'text-slate-500 font-medium hover:text-slate-700'", "isActive ? 'text-emerald-900 font-semibold' : 'text-slate-500 font-medium hover:text-slate-700'")
          replace(path, "p-1 rounded-xl transition-colors ${isActive ? 'bg-emerald-100/90 text-emerald-800' : ''}", "p-1.5 rounded-lg transition-colors ${isActive ? 'bg-emerald-50 text-emerald-800' : 'text-slate-500'}")
          replace(path, 'text-[10px] tracking-tight mt-0.5 truncate w-full text-center', 'text-xs tracking-tight mt-0.5 truncate w-full text-center')

          p = Path(path)
          text = p.read_text()
          text, n = re.subn(r'(onClick=\{\(\) => setActiveTab\(item\.id\)\}\n)(\s+className=)', r"\1                aria-current={isActive ? 'page' : undefined}\n\2", text, count=1)
          if n != 1:
              raise SystemExit('Failed to add aria-current to view-only bottom nav')
          text, n = re.subn(r'(aria-label=\{label\}\n)(\s*>)', r"\1      aria-current={isActive ? 'page' : undefined}\n\2", text, count=1)
          if n != 1:
              raise SystemExit('Failed to add aria-current to NavButton')
          p.write_text(text)

          # Desktop primary navigation.
          path = 'src/App.tsx'
          p = Path(path)
          text = p.read_text()
          text, n = re.subn(
              r'className=\{`hidden md:grid bg-white/85 backdrop-blur-md rounded-2xl p-1\.5 shadow-xs border border-slate-200/80 gap-1\.5 \$\{\s*isUstadz \? \'grid-cols-6\' : \'grid-cols-3\'\s*\}`\}',
              'className="hidden md:flex items-stretch gap-1 border-b border-slate-200 bg-white px-1"',
              text,
              count=1,
          )
          if n != 1:
              raise SystemExit('Failed to replace desktop navigation shell')
          old = 'press-feedback min-w-0 py-2.5 px-2 lg:px-3 rounded-xl text-xs font-bold transition-colors flex items-center justify-center gap-1.5 lg:gap-2 cursor-pointer'
          if old not in text:
              raise SystemExit('Desktop navigation button token not found')
          text = text.replace(old, 'press-feedback min-h-11 min-w-0 px-3 lg:px-4 text-sm font-semibold transition-colors flex items-center justify-center gap-2 cursor-pointer border-b-2 -mb-px focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-emerald-500 focus-visible:ring-inset')
          text = text.replace("'bg-emerald-800 text-white shadow-xs'", "'border-emerald-700 bg-emerald-50/60 text-emerald-900'")
          text = text.replace("'text-slate-600 hover:bg-slate-100'", "'border-transparent text-slate-600 hover:bg-slate-50 hover:text-emerald-800'")
          text = text.replace("'text-slate-600 hover:bg-emerald-50 hover:text-emerald-800'", "'border-transparent text-slate-600 hover:bg-slate-50 hover:text-emerald-800'")
          p.write_text(text)
          PY

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: TypeScript check
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: P2.11 finish gate
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          app = Path('src/App.tsx').read_text()
          nav = Path('src/components/Navbar.tsx').read_text()
          bottom = Path('src/components/BottomNav.tsx').read_text()

          assert 'hidden md:flex items-stretch gap-1 border-b border-slate-200 bg-white px-1' in app
          for label in ['Beranda', 'Riwayat', 'Setor', 'Kelas', 'Santri', 'Mushaf']:
              assert label in app
          assert "setIsSetorMenuOpen(true)" in app
          assert "setActiveTab('dashboard')" in app
          assert "setActiveTab('mushaf')" in app

          assert 'backdrop-blur' not in nav
          assert 'bg-gradient' not in nav
          for emoji in ['🛡️', '👨‍👩‍👧', '📖']:
              assert emoji not in nav
          assert 'onLogout' in nav and 'onRefresh' in nav
          for token in ['text-[9px]', 'text-[10px]', 'text-[11px]']:
              assert token not in nav, f'{token} remains in Navbar'

          assert 'backdrop-blur' not in bottom
          assert 'bg-gradient' not in bottom
          assert 'text-[10px]' not in bottom
          assert bottom.count("aria-current={isActive ? 'page' : undefined}") >= 2
          assert '<SetorActionSheet' in bottom
          assert "setIsActionSheetOpen(true)" in bottom
          PY
          git diff --check

      - name: Commit verified P2.11 change
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx src/components/Navbar.tsx src/components/BottomNav.tsx
          git commit -m "refactor: polish P2.11 navigation visual hierarchy"
          git push origin HEAD:p2-11-navigation-visual
