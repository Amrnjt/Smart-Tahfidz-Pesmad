name: P1.4 Transient Patch

on:
  push:
    branches:
      - ux/p1-4-history-selection-safety
    paths:
      - .github/workflows/p1-4-transient-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ux/p1-4-history-selection-safety

      - name: Apply scoped history selection patch
        run: node scripts/p1-4-history-selection-safety.mjs

      - name: Commit patched component
        run: |
          if git diff --quiet -- src/components/HistoryTable.tsx; then
            echo "HistoryTable already patched."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/HistoryTable.tsx
          git commit -m "P1.4: scope history batch selection to visible results"
          git push origin HEAD:ux/p1-4-history-selection-safety
