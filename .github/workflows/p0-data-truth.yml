name: P0 Data Truth Gate

on:
  push:
    branches:
      - fix/p0-2-remove-production-demo-fallback
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: TypeScript check
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Verify bounded History regressions
        run: |
          npx tsx --test tests/history-query-contract.test.ts tests/history-range-state.test.ts
          node --test tests/history-repository-source.test.mjs tests/realtime-scope-regression.test.mjs tests/no-unbounded-setoran-read.test.mjs tests/historical-mutation-regression.test.mjs tests/route-prefetch-source.test.mjs

      - name: Verify soft-delete Trash regressions
        run: node --test tests/soft-delete-trash.test.mjs

      - name: Verify multi-pengampu kelas regressions
        run: npx tsx --test tests/multi-pengampu-kelas.test.ts

      - name: Verify Binnadzor class model
        run: npx tsx --test tests/binnadzor-class-model.test.ts

      - name: Verify mobile dialog contract
        run: node --test tests/mobile-dialog-contract.test.mjs tests/mobile-dialog-layering.test.mjs

      - name: Verify formal academic regressions
        run: node --test tests/formal-education-source.test.mjs tests/academic-history-source.test.mjs tests/formal-promotion-source.test.mjs tests/academic-report-source.test.mjs tests/collective-academic-report-source.test.mjs tests/shared-academic-context-source.test.mjs tests/wali-academic-experience-source.test.mjs tests/santri-academic-experience-source.test.mjs tests/pimpinan-academic-experience-source.test.mjs tests/superadmin-control-center-source.test.mjs tests/cross-role-security-polish-source.test.mjs

      - name: Verify P0 repository cleanup
        run: node --test tests/p0-repo-cleanup.test.mjs

      - name: Ensure production storage has no sample fallback
        run: |
          if grep -q "sampleDatabase\|INITIAL_USERS\|INITIAL_SANTRI\|INITIAL_ZIYADAH\|INITIAL_MUROJAAH\|INITIAL_BINNADZOR\|INITIAL_PEMBELAJARAN" src/services/storageService.ts; then
            echo "Production storageService still references sample/demo fixtures."
            exit 1
          fi
