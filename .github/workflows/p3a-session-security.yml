name: P3A Session Security Hardening

on:
  push:
    branches:
      - feat/p1-pimpinan-role-foundation
    paths:
      - '.github/workflows/p3a-session-security.yml'

permissions:
  contents: write

jobs:
  harden-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/p1-pimpinan-role-foundation
          fetch-depth: 0

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Write P3A regression test
        shell: bash
        run: |
          cat > tests/p3-session-security.test.mjs <<'EOF'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          import test from 'node:test';

          const source = readFileSync('src/services/storageService.ts', 'utf8');

          test('Pimpinan role survives authentication and session normalization', () => {
            assert.match(source, /import \{ normalizeUserRole \} from '\.\.\/utils\/roles';/);
            assert.match(source, /const normalizedRole = normalizeUserRole\(matched\.role\);/);
            assert.match(source, /matched\.role = normalizedRole;/);
            assert.match(source, /const normalizedRole = normalizeUserRole\(user\.role\);/);
            assert.match(source, /if \(!normalizedRole\) return null;/);
          });

          test('Pimpinan cloud mutations are blocked at the service layer', () => {
            assert.match(source, /function assertCloudMutationAllowed\(session: User \| null\): void/);
            assert.match(source, /normalizeUserRole\(session\?\.role\) === 'Pimpinan'/);

            const methods = [
              'saveZiyadah', 'saveMurojaah', 'saveBinnadzor', 'savePembelajaran',
              'deleteRecord', 'deleteRecordsBatch', 'restoreTrashRecord',
              'permanentlyDeleteTrashRecord', 'emptyTrash', 'updateRecord',
              'setProgramLiburanActive', 'savePantauanLiburan', 'deletePantauanLiburan',
              'addSantri', 'updateSantri', 'deleteSantri',
              'addUser', 'updateUser', 'deleteUser',
              'addKelas', 'updateKelas', 'deleteKelas'
            ];

            for (const method of methods) {
              const start = source.indexOf(`async ${method}`);
              assert.notEqual(start, -1, `method ${method} should exist`);
              const snippet = source.slice(start, start + 520);
              assert.match(
                snippet,
                /assertCloudMutationAllowed\(this\.getSession\(\)\);/,
                `${method} must enforce the Pimpinan read-only guard`,
              );
            }
          });

          test('Pimpinan accounts are never linked to a santri id by user persistence', () => {
            assert.match(source, /\['Ustadz', 'Superadmin', 'Pimpinan'\]\.includes\(user\.role\)/);
            assert.match(source, /\['Ustadz', 'Superadmin', 'Pimpinan'\]\.includes\(cleanUpdate\.role\)/);
          });
          EOF

      - name: Verify RED before production patch
        shell: bash
        run: |
          set +e
          node --test tests/p3-session-security.test.mjs > /tmp/p3-red.log 2>&1
          status=$?
          cat /tmp/p3-red.log
          if [ "$status" -eq 0 ]; then
            echo 'Expected the P3A regression test to fail before the patch.'
            exit 1
          fi
          echo 'RED confirmed: old auth/session implementation fails the new security contract.'

      - name: Apply narrow P3A patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/services/storageService.ts')
          text = path.read_text()

          import_anchor = "import { getTodayInputFormat, getCurrentTimeInputFormat } from '../utils/dateFormatter';\n"
          if "import { normalizeUserRole } from '../utils/roles';" not in text:
              assert import_anchor in text
              text = text.replace(
                  import_anchor,
                  import_anchor + "import { normalizeUserRole } from '../utils/roles';\n",
                  1,
              )

          helper_anchor = "function cleanForFirestore<T>(data: T): T {\n  return JSON.parse(JSON.stringify(data));\n}\n"
          helper = """function assertCloudMutationAllowed(session: User | null): void {\n  if (normalizeUserRole(session?.role) === 'Pimpinan') {\n    throw new Error('Akun Pimpinan bersifat view-only dan tidak dapat mengubah data.');\n  }\n}\n\n"""
          if "function assertCloudMutationAllowed" not in text:
              assert helper_anchor in text
              text = text.replace(helper_anchor, helper_anchor + "\n" + helper, 1)

          old_auth = """    if (matched) {\n      const r = String(matched.role || '').trim().toLowerCase();\n      if (r === 'superadmin') {\n        matched.role = 'Superadmin';\n      } else if (r === 'wali' || r.includes('wali')) {\n        matched.role = 'Wali';\n      } else if (r === 'santri') {\n        matched.role = 'Santri';\n      } else {\n        matched.role = 'Ustadz';\n      }\n\n      this.setSession(matched);\n      return { success: true, user: matched };\n    }\n"""
          new_auth = """    if (matched) {\n      const normalizedRole = normalizeUserRole(matched.role);\n      if (!normalizedRole) {\n        return { success: false, message: 'Role akun tidak dikenali. Hubungi administrator.' };\n      }\n\n      matched.role = normalizedRole;\n      this.setSession(matched);\n      return { success: true, user: matched };\n    }\n"""
          if old_auth in text:
              text = text.replace(old_auth, new_auth, 1)
          else:
              assert "const normalizedRole = normalizeUserRole(matched.role);" in text

          old_session = """  getSession(): User | null {\n    const data = localStorage.getItem(STORAGE_KEYS.SESSION);\n    if (!data) return null;\n    try {\n      const user = JSON.parse(data);\n      if (user) {\n        const r = String(user.role || '').trim().toLowerCase();\n        if (r === 'superadmin') {\n          user.role = 'Superadmin';\n        } else if (r === 'wali' || r.includes('wali')) {\n          user.role = 'Wali';\n        } else if (r === 'santri') {\n          user.role = 'Santri';\n        } else {\n          user.role = 'Ustadz';\n        }\n      }\n      return user;\n    } catch {\n      return null;\n    }\n  },\n"""
          new_session = """  getSession(): User | null {\n    const data = localStorage.getItem(STORAGE_KEYS.SESSION);\n    if (!data) return null;\n    try {\n      const user = JSON.parse(data) as User;\n      const normalizedRole = normalizeUserRole(user.role);\n      if (!normalizedRole) return null;\n      return { ...user, role: normalizedRole };\n    } catch {\n      return null;\n    }\n  },\n"""
          if old_session in text:
              text = text.replace(old_session, new_session, 1)
          else:
              assert "const normalizedRole = normalizeUserRole(user.role);" in text

          text = text.replace(
              "idSantri: (user.role === 'Ustadz' || user.role === 'Superadmin') ? '' : (user.idSantri || '')",
              "idSantri: ['Ustadz', 'Superadmin', 'Pimpinan'].includes(user.role) ? '' : (user.idSantri || '')",
              1,
          )

          update_anchor = "    if (cleanUpdate.nama) cleanUpdate.nama = cleanUpdate.nama.trim();\n"
          update_line = "    if (cleanUpdate.role && ['Ustadz', 'Superadmin', 'Pimpinan'].includes(cleanUpdate.role)) cleanUpdate.idSantri = '';\n"
          if update_line not in text:
              assert update_anchor in text
              text = text.replace(update_anchor, update_anchor + update_line, 1)

          methods = [
              'saveZiyadah', 'saveMurojaah', 'saveBinnadzor', 'savePembelajaran',
              'purgeExpiredTrash', 'deleteRecord', 'deleteRecordsBatch', 'restoreTrashRecord',
              'permanentlyDeleteTrashRecord', 'emptyTrash', 'updateRecord',
              'setProgramLiburanActive', 'savePantauanLiburan', 'deletePantauanLiburan',
              'addSantri', 'updateSantri', 'deleteSantri',
              'addUser', 'updateUser', 'deleteUser',
              'addKelas', 'updateKelas', 'deleteKelas'
          ]
          guard = "    assertCloudMutationAllowed(this.getSession());\n"
          for method in methods:
              marker = f"  async {method}"
              start = text.find(marker)
              assert start != -1, f'missing method {method}'
              brace = text.find('{\n', start)
              assert brace != -1, f'missing opening brace for {method}'
              insert_at = brace + 2
              if text[insert_at:insert_at + len(guard)] != guard:
                  text = text[:insert_at] + guard + text[insert_at:]

          path.write_text(text)
          PY

      - name: Verify GREEN regression tests
        run: node --test tests/p3-session-security.test.mjs tests/roles-permissions.test.ts tests/pimpinan-runtime-access.test.ts tests/pimpinan-readonly-ui.test.mjs

      - name: TypeScript check
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Commit verified P3A patch and remove temporary workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/workflows/p3a-session-security.yml
          git add src/services/storageService.ts tests/p3-session-security.test.mjs .github/workflows/p3a-session-security.yml
          git commit -m 'security: harden Pimpinan session mutations'
          git push origin HEAD:feat/p1-pimpinan-role-foundation
