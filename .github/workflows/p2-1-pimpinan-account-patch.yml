name: P2.1 Pimpinan Account Patch

on:
  push:
    branches:
      - feat/p1-pimpinan-role-foundation
    paths:
      - '.github/workflows/p2-1-pimpinan-account-patch.yml'

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/p1-pimpinan-role-foundation
          fetch-depth: 0

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Apply narrow P2.1 account patch
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'src/components/SantriManagement.tsx';
          let s = fs.readFileSync(path, 'utf8');

          const replaceOnce = (from, to, label) => {
            const count = s.split(from).length - 1;
            if (count !== 1) throw new Error(`${label}: expected exactly 1 match, got ${count}`);
            s = s.replace(from, to);
          };

          replaceOnce(
            "idSantri: (editRole === 'Ustadz' || editRole === 'Superadmin') ? '' : editIdSantri.trim()",
            "idSantri: (editRole === 'Ustadz' || editRole === 'Superadmin' || editRole === 'Pimpinan') ? '' : editIdSantri.trim()",
            'edit Pimpinan idSantri clearing'
          );

          replaceOnce(
            "idSantri: (newUserRole === 'Ustadz' || newUserRole === 'Superadmin') ? '' : newUserIdSantri.trim()",
            "idSantri: (newUserRole === 'Ustadz' || newUserRole === 'Superadmin' || newUserRole === 'Pimpinan') ? '' : newUserIdSantri.trim()",
            'new Pimpinan idSantri clearing'
          );

          replaceOnce(
            '<option value="Superadmin">Superadmin (Akses Penuh Seluruh Sistem & Manajemen)</option>\n                  <option value="Ustadz">',
            '<option value="Superadmin">Superadmin (Akses Penuh Seluruh Sistem & Manajemen)</option>\n                  <option value="Pimpinan">Pimpinan (Monitoring Global • View-Only)</option>\n                  <option value="Ustadz">',
            'edit role option'
          );

          replaceOnce(
            '<option value="Superadmin">Superadmin</option>\n                    <option value="Ustadz">',
            '<option value="Superadmin">Superadmin</option>\n                    <option value="Pimpinan">Pimpinan (Monitoring Global • View-Only)</option>\n                    <option value="Ustadz">',
            'new role option'
          );

          replaceOnce(
            "const roleTone = u.role === 'Superadmin'\n                  ? 'border-amber-200 bg-amber-50 text-amber-900'\n                  : u.role === 'Ustadz'",
            "const roleTone = u.role === 'Superadmin'\n                  ? 'border-amber-200 bg-amber-50 text-amber-900'\n                  : u.role === 'Pimpinan'\n                  ? 'border-violet-200 bg-violet-50 text-violet-900'\n                  : u.role === 'Ustadz'",
            'mobile Pimpinan tone'
          );

          replaceOnce(
            "} else if (u.role === 'Ustadz') {\n                      roleBadge = (",
            "} else if (u.role === 'Pimpinan') {\n                      roleBadge = (\n                        <span className=\"inline-flex items-center gap-1 px-2.5 py-0.5 rounded-lg bg-violet-100 text-violet-900 font-bold text-xs border border-violet-300\">\n                          <Shield className=\"w-3 h-3 text-violet-700\" /> Pimpinan\n                        </span>\n                      );\n                    } else if (u.role === 'Ustadz') {\n                      roleBadge = (",
            'desktop Pimpinan badge'
          );

          replaceOnce(
            'mengubah Role (Ustadz/Wali/Santri), Username, Password, dan Kaitan ID Santri',
            'mengubah Role (Pimpinan/Ustadz/Wali/Santri), Username, Password, dan Kaitan ID Santri',
            'role help copy'
          );

          fs.writeFileSync(path, s);
          NODE

      - name: Verify P2.1 regression tests
        run: |
          node --test tests/pimpinan-readonly-ui.test.mjs tests/pimpinan-view-only-ui.test.mjs
          npx tsx --test tests/roles-permissions.test.ts tests/pimpinan-runtime-access.test.ts

      - name: TypeScript check
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Commit verified patch and remove temporary workflow
        run: |
          rm .github/workflows/p2-1-pimpinan-account-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/SantriManagement.tsx .github/workflows/p2-1-pimpinan-account-patch.yml
          git commit -m "feat: finish Pimpinan account identity"
          git push origin HEAD:feat/p1-pimpinan-role-foundation
