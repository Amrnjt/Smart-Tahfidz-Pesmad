name: P1.7 Accessibility

on:
  push:
    branches:
      - p1-7-accessibility

permissions:
  contents: write

jobs:
  patch-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: p1-7-accessibility
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Apply P1.7 patch
        run: python .github/p1_7_patch.py

      - name: Validate build and accessibility contract
        run: |
          npm install --no-package-lock --ignore-scripts
          npm run build
          git diff --check
          test -f src/hooks/useAccessibleDialog.ts
          grep -q "dialogStack" src/hooks/useAccessibleDialog.ts
          grep -q "document.body.style.overflow = 'hidden'" src/hooks/useAccessibleDialog.ts
          grep -q "event.key === 'Escape'" src/hooks/useAccessibleDialog.ts
          grep -q "event.key !== 'Tab'" src/hooks/useAccessibleDialog.ts
          grep -q "trigger?.isConnected" src/hooks/useAccessibleDialog.ts
          grep -q "ref={dialogRef}" src/components/SetorActionSheet.tsx
          grep -q "ref={dialogRef}" src/components/PantauanLiburanMonitorModal.tsx
          grep -q "ref={dialogRef}" src/components/UnduhLaporanModal.tsx
          grep -q "editDialogRef" src/components/HistoryTable.tsx
          grep -q "deleteDialogRef" src/components/HistoryTable.tsx
          grep -q "batchDeleteDialogRef" src/components/HistoryTable.tsx
          grep -q "addDialogRef" src/components/KelasManagement.tsx
          grep -q "editDialogRef" src/components/KelasManagement.tsx
          grep -q "deleteDialogRef" src/components/KelasManagement.tsx
          grep -q "addSantriDialogRef" src/components/SantriManagement.tsx
          grep -q "addUserDialogRef" src/components/SantriManagement.tsx
          grep -q "deleteSantriDialogRef" src/components/SantriManagement.tsx
          grep -q "deleteUserDialogRef" src/components/SantriManagement.tsx
          grep -q "max-h-\[calc(100dvh" src/components/HistoryTable.tsx
          grep -q "max-h-\[calc(100dvh" src/components/KelasManagement.tsx
          grep -q "max-h-\[calc(100dvh" src/components/SantriManagement.tsx
          grep -q "max-h-\[calc(100dvh" src/components/PantauanLiburanMonitorModal.tsx
          grep -q "max-h-\[calc(100dvh" src/components/PantauanLiburanWaliSection.tsx
          ! grep -n "window.addEventListener('keydown'" src/components/SetorActionSheet.tsx

      - name: Commit verified change
        run: |
          rm .github/p1_7_patch.py .github/workflows/p1-7-accessibility.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src .github
          git diff --cached --check
          git commit -m "refactor: harden P1.7 dialog accessibility"
          git push origin p1-7-accessibility
