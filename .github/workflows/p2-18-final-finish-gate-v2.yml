name: P2.18 Final Finish Gate v2

on:
  push:
    branches:
      - p2-18-final-finish-gate
    paths:
      - .github/workflows/p2-18-final-finish-gate-v2.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: p2-18-final-finish-gate
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Measure baseline build
        shell: bash
        run: |
          npm run build
          BASE_TOTAL_JS=$(find dist/assets -type f -name '*.js' -printf '%s\n' | awk '{s+=$1} END {print s+0}')
          BASE_ENTRY_REL=$(node -e "const fs=require('fs');const h=fs.readFileSync('dist/index.html','utf8');const m=h.match(/<script[^>]+src=\"\/([^\"]+\.js)\"/);if(!m)process.exit(2);console.log(m[1])")
          BASE_ENTRY_JS=$(stat -c%s "dist/$BASE_ENTRY_REL")
          BASE_ENTRY_GZIP=$(gzip -c "dist/$BASE_ENTRY_REL" | wc -c)
          echo "$BASE_TOTAL_JS" > /tmp/p2-18-base-total-js
          echo "$BASE_ENTRY_JS" > /tmp/p2-18-base-entry-js
          echo "$BASE_ENTRY_GZIP" > /tmp/p2-18-base-entry-gzip
          echo "Baseline total JS: $BASE_TOTAL_JS bytes"
          echo "Baseline entry JS: $BASE_ENTRY_JS bytes"
          echo "Baseline entry gzip: $BASE_ENTRY_GZIP bytes"
          find dist/assets -type f -name '*.js' -printf '%s %p\n' | sort -nr | head -8
          rm -rf dist

      - name: Apply route code splitting
        run: python .github/p2-18-patch.py

      - name: TypeScript check
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Measure final bundle
        shell: bash
        run: |
          BASE_TOTAL_JS=$(cat /tmp/p2-18-base-total-js)
          BASE_ENTRY_JS=$(cat /tmp/p2-18-base-entry-js)
          BASE_ENTRY_GZIP=$(cat /tmp/p2-18-base-entry-gzip)
          FINAL_TOTAL_JS=$(find dist/assets -type f -name '*.js' -printf '%s\n' | awk '{s+=$1} END {print s+0}')
          FINAL_ENTRY_REL=$(node -e "const fs=require('fs');const h=fs.readFileSync('dist/index.html','utf8');const m=h.match(/<script[^>]+src=\"\/([^\"]+\.js)\"/);if(!m)process.exit(2);console.log(m[1])")
          FINAL_ENTRY_JS=$(stat -c%s "dist/$FINAL_ENTRY_REL")
          FINAL_ENTRY_GZIP=$(gzip -c "dist/$FINAL_ENTRY_REL" | wc -c)
          echo "Baseline total JS: $BASE_TOTAL_JS bytes"
          echo "Final total JS:    $FINAL_TOTAL_JS bytes"
          echo "Baseline entry JS: $BASE_ENTRY_JS bytes"
          echo "Final entry JS:    $FINAL_ENTRY_JS bytes"
          echo "Baseline entry gzip: $BASE_ENTRY_GZIP bytes"
          echo "Final entry gzip:    $FINAL_ENTRY_GZIP bytes"
          echo "Final JS chunks:"
          find dist/assets -type f -name '*.js' -printf '%s %p\n' | sort -nr | head -12
          MAX_TOTAL=$((BASE_TOTAL_JS + 51200))
          test "$FINAL_TOTAL_JS" -le "$MAX_TOTAL"
          test "$FINAL_ENTRY_JS" -lt "$BASE_ENTRY_JS"
          TARGET_ENTRY=$((BASE_ENTRY_JS * 75 / 100))
          test "$FINAL_ENTRY_JS" -le "$TARGET_ENTRY"

      - name: P2.18 final static gate
        shell: bash
        run: |
          python .github/p2-18-gate.py
          git diff --check

      - name: Commit verified App change
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx
          git diff --cached --quiet && { echo "No App change to commit"; exit 1; }
          git commit -m "perf: code-split P2.18 feature routes"
          git fetch origin p2-18-final-finish-gate
          git rebase origin/p2-18-final-finish-gate
          git push origin HEAD:p2-18-final-finish-gate
