name: P2.2 Ustadz Polish Validation

on:
  push:
    branches: [p2-2-ustadz-polish]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --no-package-lock --ignore-scripts
      - name: TypeScript check
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: P2.2 polish finish gate
        shell: bash
        run: |
          set -euo pipefail
          file=src/components/UstadzDashboard.tsx
          grep -q 'Pesmad Smart Tahfidz' "$file"
          grep -q 'Pusat kerja Ustadz' "$file"
          grep -q 'Mulai Setor' "$file"
          grep -q 'Tindak lanjut setoran' "$file"
          grep -q 'Status operasional' "$file"
          grep -q 'Aktivitas terbaru' "$file"
          grep -q 'Santri & setoran berikutnya' "$file"
          grep -q "onClick={onOpenSetorMenu}" "$file"
          grep -q "setActiveTab('mushaf')" "$file"
          grep -q "setActiveTab('riwayat')" "$file"
          grep -q 'sangatBaikPercent === null' "$file"
          grep -q 'TrenHafalanBulananChart' "$file"
          grep -q 'HafalanStatsChart' "$file"
          grep -q 'PesmadLogo' "$file"
          ! grep -q 'bg-gradient' "$file"
          ! grep -q 'backdrop-blur' "$file"
          ! grep -q 'text-\[9px\]' "$file"
          ! grep -q 'text-\[10px\]' "$file"
          ! grep -q 'Sparkles' "$file"
          git diff --check
