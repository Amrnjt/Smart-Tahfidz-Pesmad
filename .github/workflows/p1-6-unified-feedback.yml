name: P1.6 Unified Feedback
on:
  push:
    paths:
      - '.github/p1_6_patch.py'
      - '.github/workflows/p1-6-unified-feedback.yml'

permissions:
  contents: write

jobs:
  patch-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply patch
        run: python .github/p1_6_patch.py
      - name: Validate build and P1.6 contract
        run: |
          npm install --no-package-lock --ignore-scripts
          npm run build
          git diff --check
          ! grep -R "alert(" -n src/components
          ! grep -R "window.confirm" -n src/components
          ! grep -R "deleteToast" -n src/components/HistoryTable.tsx
          grep -q "onNotify" src/components/HistoryTable.tsx
          grep -q "onNotify" src/components/SantriManagement.tsx
          grep -q "onNotify" src/components/KelasManagement.tsx
          grep -q "onNotify" src/components/PantauanLiburanWaliSection.tsx
          grep -q "await batch.commit()" src/services/storageService.ts
          grep -q "Data berhasil disinkronkan dengan Cloud Firestore" src/App.tsx
      - name: Commit verified change
        run: |
          rm .github/p1_6_patch.py .github/workflows/p1-6-unified-feedback.yml
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "refactor: unify P1.6 feedback and Cloud truth"
          git push origin main
