name: P2.2 Transient Dashboard Markers

on:
  push:
    branches:
      - design/p2-2-dashboard-experience
    paths:
      - '.github/workflows/p2-2-transient-dashboard-markers.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: design/p2-2-dashboard-experience

      - name: Apply dashboard persona markers
        run: node scripts/p2-2-dashboard-markers.mjs

      - name: Commit markers
        run: |
          if git diff --quiet -- src/components/UstadzDashboard.tsx src/components/WaliDashboard.tsx src/components/SantriDashboard.tsx; then
            echo "No marker patch needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/UstadzDashboard.tsx src/components/WaliDashboard.tsx src/components/SantriDashboard.tsx
          git commit -m "P2.2: mark role-specific dashboard roots"
          git push origin HEAD:design/p2-2-dashboard-experience
