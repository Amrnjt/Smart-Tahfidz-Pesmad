name: P2.7 Santri Management Validation

on:
  push:
    branches: [p2-7-santri-management]

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply P2.7 management polish
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/components/SantriManagement.tsx')
          text = path.read_text()

          replacements = {
            'Save, Sparkles, Phone': 'Save, Phone',
            'bg-white rounded-3xl p-5 sm:p-7 border border-slate-200/90 shadow-sm space-y-6': 'space-y-6',
            'flex flex-col sm:flex-row sm:items-center justify-between gap-4 pb-4 border-b border-slate-100': 'flex flex-col lg:flex-row lg:items-end justify-between gap-4 pb-5 border-b border-slate-200',
            'font-extrabold text-slate-800 text-base sm:text-lg flex items-center gap-2': 'ui-page-title text-slate-900 flex items-center gap-2',
            'text-xs text-slate-500': 'text-xs text-slate-500',
            'flex items-center bg-slate-100 p-1 rounded-2xl border border-slate-200/80': 'grid grid-cols-2 bg-slate-100 p-1 rounded-xl border border-slate-200 w-full lg:w-auto',
            'px-3.5 py-1.5 rounded-xl text-xs font-bold transition-all cursor-pointer flex items-center gap-1.5': 'ui-control px-3 rounded-lg text-sm font-semibold transition-colors cursor-pointer flex items-center justify-center gap-2',
            "? 'bg-white text-emerald-900 shadow-xs'": "? 'bg-white text-emerald-900 border border-slate-200'",
            'flex flex-col sm:flex-row items-center justify-between gap-3': 'flex flex-col sm:flex-row sm:items-center justify-between gap-3',
            'relative w-full sm:w-72': 'relative w-full sm:max-w-md sm:flex-1',
            'w-full pl-9 pr-3.5 py-2 bg-slate-50 border border-slate-300 rounded-xl text-xs font-medium focus:bg-white focus:outline-none focus:ring-2 focus:ring-emerald-500': 'ui-control w-full pl-10 pr-3.5 bg-white border border-slate-300 rounded-xl text-sm font-medium text-slate-900 placeholder-slate-400',
            'w-full sm:w-auto px-4 py-2 bg-emerald-800 hover:bg-emerald-700 active:bg-emerald-950 text-white rounded-xl text-xs font-bold shadow-xs transition flex items-center justify-center gap-1.5 cursor-pointer whitespace-nowrap': 'ui-control w-full sm:w-auto px-4 bg-emerald-800 hover:bg-emerald-700 active:bg-emerald-950 text-white rounded-xl text-sm font-bold transition-colors flex items-center justify-center gap-2 cursor-pointer whitespace-nowrap',
            'grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4': 'grid grid-cols-1 lg:grid-cols-2 xl:grid-cols-3 gap-4',
            'p-5 rounded-2xl bg-slate-50 border border-slate-200 hover:border-emerald-500 hover:bg-emerald-50/20 transition-all flex flex-col justify-between space-y-4 group relative': 'p-5 rounded-2xl bg-white border border-slate-200 hover:border-slate-300 transition-colors flex flex-col justify-between space-y-4 group relative',
            'text-[9px]': 'text-xs',
            'text-[10px]': 'text-xs',
            'text-[11px]': 'text-xs',
            'rounded-full bg-slate-200/70 text-slate-700': 'rounded-lg bg-emerald-50 border border-emerald-200 text-emerald-800',
            "{stats.totalMurojaah} Muroja'ah": "{stats.totalMurojaah} Muroja'ah",
            'pt-3 border-t border-slate-200/80 text-xs text-slate-500 flex flex-col sm:flex-row sm:items-center justify-between gap-2': 'pt-3 border-t border-slate-200 text-xs text-slate-500 flex flex-col gap-3',
            'truncate text-xs space-y-0.5': 'text-xs space-y-1',
            'flex items-center gap-1.5 flex-wrap justify-end flex-shrink-0': 'flex items-center gap-2 flex-wrap',
            'px-2 py-1 bg-emerald-50 hover:bg-emerald-100 text-emerald-800 border border-emerald-200 rounded-lg transition cursor-pointer flex items-center gap-1 text-xs font-bold': 'min-h-9 px-3 bg-emerald-50 hover:bg-emerald-100 text-emerald-800 border border-emerald-200 rounded-lg transition-colors cursor-pointer flex items-center gap-1.5 text-xs font-semibold',
            'p-1 text-teal-700 hover:bg-teal-100 bg-teal-50 border border-teal-200 rounded-lg transition flex items-center justify-center cursor-pointer': 'min-h-9 min-w-9 p-2 text-teal-700 hover:bg-teal-100 bg-teal-50 border border-teal-200 rounded-lg transition-colors flex items-center justify-center cursor-pointer',
            'p-1 text-slate-600 hover:bg-slate-200 rounded-lg transition cursor-pointer flex items-center gap-1 text-xs font-semibold': 'min-h-9 px-3 text-slate-700 hover:bg-slate-100 border border-slate-200 rounded-lg transition-colors cursor-pointer flex items-center gap-1.5 text-xs font-semibold',
            'p-1 text-slate-400 hover:text-rose-600 hover:bg-rose-50 rounded-lg transition cursor-pointer flex items-center gap-1 text-xs font-semibold': 'min-h-9 px-3 text-rose-700 hover:bg-rose-50 border border-rose-200 rounded-lg transition-colors cursor-pointer flex items-center gap-1.5 text-xs font-semibold',
            '<span className="hidden sm:inline">Edit</span>': '<span>Edit</span>',
            '<span className="hidden sm:inline text-rose-600">Hapus</span>': '<span>Hapus</span>',
            'Klik tombol <b>Edit (✏️)</b>': 'Gunakan tombol <b>Edit</b>',
            'overflow-x-auto border border-slate-200 rounded-2xl': 'hidden sm:block overflow-x-auto border border-slate-200 rounded-2xl bg-white',
            'bg-slate-100/90 text-slate-700 uppercase font-bold tracking-wider border-b border-slate-200': 'bg-slate-50 text-slate-600 font-semibold border-b border-slate-200',
            'rounded-full bg-amber-100': 'rounded-lg bg-amber-100',
            'rounded-full bg-emerald-100': 'rounded-lg bg-emerald-100',
            'rounded-full bg-teal-100': 'rounded-lg bg-teal-100',
            'rounded-full bg-cyan-100': 'rounded-lg bg-cyan-100',
            '<option value="Superadmin">👑 Superadmin (Akses Penuh Seluruh Sistem & Manajemen)</option>': '<option value="Superadmin">Superadmin (Akses Penuh Seluruh Sistem & Manajemen)</option>',
            '<option value="Ustadz">🛡️ Ustadz (Input Setoran, Kelola Santri & Akun)</option>': '<option value="Ustadz">Ustadz (Input Setoran, Kelola Santri & Akun)</option>',
            '<option value="Wali">👥 Wali Santri (Monitoring Mutaba\'ah & Progres Ananda)</option>': '<option value="Wali">Wali Santri (Monitoring Mutaba\'ah & Progres Ananda)</option>',
            '<option value="Santri">📖 Santri (View-Only: Lihat Progres Pribadi & Mushaf)</option>': '<option value="Santri">Santri (View-Only: Lihat Progres Pribadi & Mushaf)</option>',
          }

          for old, new in replacements.items():
              text = text.replace(old, new)

          # Give the two activity counters distinct semantic treatment.
          text = text.replace(
              '<span className="text-xs font-medium px-2 py-0.5 rounded-lg bg-emerald-50 border border-emerald-200 text-emerald-800">\n                          {stats.totalMurojaah} Muroja\'ah\n                        </span>',
              '<span className="text-xs font-medium px-2 py-0.5 rounded-lg bg-teal-50 border border-teal-200 text-teal-800">\n                          {stats.totalMurojaah} Muroja\'ah\n                        </span>'
          )

          # Replace decorative Sparkles icon in empty state with a functional Shield icon.
          text = text.replace('<Sparkles className="w-4 h-4 text-emerald-700 flex-shrink-0 mt-0.5" />', '<Shield className="w-4 h-4 text-emerald-700 flex-shrink-0 mt-0.5" />')

          # Add explicit content headings for scanability.
          santri_anchor = "      {/* Tab 1: Santri Cards Grid */}\n      {activeSubTab === 'santri' && (\n        <>\n"
          if santri_anchor in text and 'Daftar santri' not in text:
              text = text.replace(santri_anchor, santri_anchor + '''          <div className="flex items-end justify-between gap-3">\n            <div>\n              <h4 className="ui-section-title">Daftar santri</h4>\n              <p className="ui-secondary mt-0.5">{filteredSantri.length} dari {santriList.length} santri ditampilkan.</p>\n            </div>\n          </div>\n''', 1)

          users_anchor = "      {activeSubTab === 'users' && (\n        <div className=\"space-y-3\">\n"
          if users_anchor in text and 'Daftar akun pengguna' not in text:
              text = text.replace(users_anchor, users_anchor + '''          <div className="flex items-end justify-between gap-3">\n            <div>\n              <h4 className="ui-section-title">Daftar akun pengguna</h4>\n              <p className="ui-secondary mt-0.5">{filteredUsers.length} dari {usersList.length} akun ditampilkan.</p>\n            </div>\n          </div>\n''', 1)

          # Mobile-specific account cards: same handlers and data, no alternate business logic.
          table_anchor = '          <div className="hidden sm:block overflow-x-auto border border-slate-200 rounded-2xl bg-white">\n'
          mobile_cards = '''          <div className="sm:hidden space-y-3">\n            {filteredUsers.length === 0 ? (\n              <div className="rounded-2xl border border-dashed border-slate-200 bg-slate-50 px-4 py-8 text-center text-sm text-slate-500">\n                Tidak ada akun yang sesuai pencarian.\n              </div>\n            ) : (\n              filteredUsers.map((u) => {\n                const isSuperadmin = u.role === 'Superadmin';\n                const roleTone = u.role === 'Superadmin'\n                  ? 'border-amber-200 bg-amber-50 text-amber-900'\n                  : u.role === 'Ustadz'\n                  ? 'border-emerald-200 bg-emerald-50 text-emerald-800'\n                  : u.role === 'Wali'\n                  ? 'border-teal-200 bg-teal-50 text-teal-800'\n                  : 'border-cyan-200 bg-cyan-50 text-cyan-800';\n\n                return (\n                  <article key={u.id} className="rounded-2xl border border-slate-200 bg-white p-4 space-y-4">\n                    <div className="flex items-start justify-between gap-3">\n                      <div className="min-w-0">\n                        <h5 className="text-sm font-bold text-slate-900 truncate">{u.nama}</h5>\n                        <p className="mt-1 text-xs text-slate-500">{u.idSantri ? `Terkait santri ${u.idSantri}` : 'Tidak terkait ID santri'}</p>\n                      </div>\n                      <span className={`flex-shrink-0 rounded-lg border px-2 py-1 text-xs font-semibold ${roleTone}`}>\n                        {u.role}\n                      </span>\n                    </div>\n\n                    <dl className="grid grid-cols-[84px,1fr] gap-x-3 gap-y-2 text-xs">\n                      <dt className="text-slate-500">Username</dt>\n                      <dd className="font-mono text-slate-700 break-all">{isSuperadmin ? 'Dirahasiakan' : u.username}</dd>\n                      <dt className="text-slate-500">Password</dt>\n                      <dd className="font-mono text-slate-700 break-all">{isSuperadmin ? 'Dirahasiakan' : u.password}</dd>\n                    </dl>\n\n                    {isSuperadmin ? (\n                      <div className="min-h-10 rounded-lg border border-amber-200 bg-amber-50 px-3 flex items-center gap-2 text-xs font-semibold text-amber-900">\n                        <Shield className="w-4 h-4" />\n                        Akun terproteksi\n                      </div>\n                    ) : (\n                      <div className="grid grid-cols-2 gap-2">\n                        <button type="button" onClick={() => handleCopyUserCredentials(u)} className="min-h-10 rounded-lg border border-slate-200 bg-white px-3 text-xs font-semibold text-slate-700 flex items-center justify-center gap-1.5">\n                          <Copy className="w-3.5 h-3.5" /> Salin\n                        </button>\n                        <button type="button" onClick={() => handleShareUserCredentials(u)} className="min-h-10 rounded-lg border border-emerald-200 bg-emerald-50 px-3 text-xs font-semibold text-emerald-800 flex items-center justify-center gap-1.5">\n                          <Share2 className="w-3.5 h-3.5" /> Bagikan\n                        </button>\n                        <button type="button" onClick={() => handleOpenEditUser(u)} className="min-h-10 rounded-lg border border-slate-200 bg-white px-3 text-xs font-semibold text-slate-700 flex items-center justify-center gap-1.5">\n                          <Edit3 className="w-3.5 h-3.5" /> Edit\n                        </button>\n                        <button type="button" onClick={() => setUserToDelete(u)} className="min-h-10 rounded-lg border border-rose-200 bg-rose-50 px-3 text-xs font-semibold text-rose-700 flex items-center justify-center gap-1.5">\n                          <Trash2 className="w-3.5 h-3.5" /> Hapus\n                        </button>\n                      </div>\n                    )}\n                  </article>\n                );\n              })\n            )}\n          </div>\n\n'''
          if table_anchor in text and 'sm:hidden space-y-3' not in text:
              text = text.replace(table_anchor, mobile_cards + table_anchor, 1)

          path.write_text(text)
          PY

          git diff -- src/components/SantriManagement.tsx
      - name: Install dependencies
        run: npm install --no-package-lock --ignore-scripts
      - name: TypeScript check
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: P2.7 finish gate
        shell: bash
        run: |
          set -euo pipefail
          file=src/components/SantriManagement.tsx
          grep -q 'Daftar santri' "$file"
          grep -q 'Daftar akun pengguna' "$file"
          grep -q 'sm:hidden space-y-3' "$file"
          grep -q 'hidden sm:block overflow-x-auto' "$file"
          grep -q 'handleCopyWaliCredentials' "$file"
          grep -q 'handleShareUserCredentials' "$file"
          grep -q 'handleSaveEditSantri' "$file"
          grep -q 'handleSaveEditUser' "$file"
          grep -q 'handleDeleteSantri' "$file"
          grep -q 'handleDeleteUser' "$file"
          grep -q 'useAccessibleDialog' "$file"
          grep -q 'storageService.deleteSantri' "$file"
          grep -q 'storageService.deleteUser' "$file"
          ! grep -q 'Sparkles' "$file"
          ! grep -q 'text-\[9px\]' "$file"
          ! grep -q 'text-\[10px\]' "$file"
          ! grep -q 'text-\[11px\]' "$file"
          ! grep -q '>👑 Superadmin' "$file"
          ! grep -q '>🛡️ Ustadz' "$file"
          git diff --check
      - name: Commit verified P2.7 change
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/SantriManagement.tsx
          if ! git diff --cached --quiet; then
            git commit -m 'refactor: redesign P2.7 Santri Management hierarchy'
            git push
          fi
