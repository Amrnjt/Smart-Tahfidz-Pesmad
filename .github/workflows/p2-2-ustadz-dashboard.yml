name: P2.2 Ustadz Dashboard Validation

on:
  push:
    branches: [p2-2-ustadz-dashboard]

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply final P2.2 wiring and typing fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          app_path = Path('src/App.tsx')
          app = app_path.read_text()
          old = """                  onSelectSantriForZiyadah={handleSelectSantriForZiyadah}\n                  isLoading={isLoadingData}\n"""
          new = """                  onSelectSantriForZiyadah={handleSelectSantriForZiyadah}\n                  onOpenSetorMenu={() => setIsSetorMenuOpen(true)}\n                  isLoading={isLoadingData}\n"""
          if old in app:
              app = app.replace(old, new, 1)
          elif 'onOpenSetorMenu={() => setIsSetorMenuOpen(true)}' not in app:
              raise SystemExit('UstadzDashboard prop anchor not found')
          app_path.write_text(app)

          dashboard_path = Path('src/components/UstadzDashboard.tsx')
          dashboard = dashboard_path.read_text()
          old_map = "const santriById = new Map(santriList.map(santri => [santri.idSantri, santri]));"
          new_map = "const santriById = new Map<string, Santri>(santriList.map(santri => [santri.idSantri, santri]));"
          if old_map in dashboard:
              dashboard = dashboard.replace(old_map, new_map, 1)
          elif new_map not in dashboard:
              raise SystemExit('santriById typing anchor not found')
          dashboard_path.write_text(dashboard)
          PY
      - name: Install dependencies
        run: npm install --no-package-lock --ignore-scripts
      - name: TypeScript check
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: P2.2 finish gate
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'onOpenSetorMenu={() => setIsSetorMenuOpen(true)}' src/App.tsx
          grep -q 'onOpenSetorMenu: () => void' src/components/UstadzDashboard.tsx
          grep -q 'new Map<string, Santri>' src/components/UstadzDashboard.tsx
          grep -q 'Perlu perhatian hari ini' src/components/UstadzDashboard.tsx
          grep -q 'Aktivitas terbaru' src/components/UstadzDashboard.tsx
          grep -q 'Belum ada setoran tersimpan untuk menghitung kualitas' src/components/UstadzDashboard.tsx
          grep -q "category: \"Muroja'ah\"" src/components/UstadzDashboard.tsx
          ! grep -q 'Sparkles' src/components/UstadzDashboard.tsx
          ! grep -q 'bg-gradient' src/components/UstadzDashboard.tsx
          ! grep -q 'text-\[9px\]' src/components/UstadzDashboard.tsx
          ! grep -q 'text-\[10px\]' src/components/UstadzDashboard.tsx
          grep -q 'TrenHafalanBulananChart' src/components/UstadzDashboard.tsx
          grep -q 'HafalanStatsChart' src/components/UstadzDashboard.tsx
          grep -q "setActiveTab('mushaf')" src/components/UstadzDashboard.tsx
          grep -q "setActiveTab('riwayat')" src/components/UstadzDashboard.tsx
          git diff --check
      - name: Commit verified dashboard change
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/App.tsx src/components/UstadzDashboard.tsx
          if ! git diff --cached --quiet; then
            git commit -m 'refactor: redesign P2.2 Ustadz dashboard'
            git push
          fi
