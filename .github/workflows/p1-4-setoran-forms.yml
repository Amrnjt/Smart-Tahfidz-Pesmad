name: P1.4 Setoran Form UX

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/p1-4-setoran-forms.yml

permissions:
  contents: write

jobs:
  patch-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Apply patch
        run: python3 .github/p1_4_patch.py

      - name: Validate build
        run: |
          npm install --no-package-lock --ignore-scripts
          npm run build
          git diff --check
          grep -q 'Setoran Ziyadah' src/components/ZiyadahForm.tsx
          grep -q "Setoran Muroja'ah" src/components/MurojaahForm.tsx
          grep -q 'Setoran Binnadzor' src/components/BinnadzorForm.tsx
          grep -q 'Setoran Pembelajaran' src/components/PembelajaranForm.tsx
          grep -q 'type="time"' src/components/PembelajaranForm.tsx
          if grep -q 'animate-bounce' src/components/ZiyadahForm.tsx src/components/MurojaahForm.tsx src/components/BinnadzorForm.tsx src/components/PembelajaranForm.tsx; then
            echo 'Decorative success bounce remains in setoran forms'
            exit 1
          fi
          if grep -q 'bg-gradient-to-r' src/components/BinnadzorForm.tsx src/components/PembelajaranForm.tsx; then
            echo 'Large header/CTA gradient remains in Binnadzor/Pembelajaran forms'
            exit 1
          fi

      - name: Commit verified change
        run: |
          rm .github/p1_4_patch.py
          rm .github/workflows/p1-4-setoran-forms.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: unify P1.4 setoran form UX"
          git push origin HEAD:main
