name: P1.3 History CSS Cleanup

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/p1-3-css-cleanup.yml

permissions:
  contents: write

jobs:
  patch-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Apply patch
        run: python3 .github/p1_3_patch.py

      - name: Validate build
        run: |
          npm install --no-package-lock --ignore-scripts
          npm run build
          git diff --check
          python3 - <<'PY'
          from pathlib import Path
          css = Path('src/index.css').read_text(encoding='utf-8')
          token_lines = [line.strip() for line in css.splitlines() if '[class~=' in line]
          allowed = ['.fixed.inset-0[class~="z-[60]"] {']
          if token_lines != allowed:
              raise SystemExit(f'Unexpected utility-token selectors remain: {token_lines}')
          print('Only the intentional P0 overlay selector remains')
          PY

      - name: Commit verified change
        run: |
          rm .github/p1_3_patch.py
          rm .github/workflows/p1-3-css-cleanup.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: remove brittle HistoryTable CSS selectors"
          git push origin HEAD:main
