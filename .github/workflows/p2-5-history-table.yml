name: P2.5 HistoryTable Validation

on:
  push:
    branches: [p2-5-history-table]

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply P2.5 visual polish
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/components/HistoryTable.tsx')
          text = path.read_text()

          replacements = {
            'text-[9px]': 'text-xs',
            'text-[10px]': 'text-xs',
            'text-[11px]': 'text-xs',
            'text-[12px]': 'text-xs',
            'text-[13px]': 'text-sm',
            "{opt.emoji} {opt.label}": "{opt.label}",
            'className="w-full h-8 pl-8 pr-8 bg-slate-50 border border-slate-300 rounded-lg text-xs font-medium text-slate-800 placeholder-slate-400 focus:bg-white focus:outline-none focus:ring-2 focus:ring-emerald-500"': 'className="ui-control w-full pl-9 pr-9 bg-white border border-slate-300 rounded-xl text-sm font-medium text-slate-900 placeholder-slate-400 focus:bg-white"',
            'className={`h-8 px-2.5 inline-flex items-center gap-1.5 rounded-lg border text-xs font-semibold transition cursor-pointer flex-shrink-0 ${': 'className={`ui-control px-3 inline-flex items-center gap-2 rounded-xl border text-sm font-semibold transition-colors cursor-pointer flex-shrink-0 ${',
            'className="rounded-xl border border-slate-200 bg-slate-50/70 p-2.5 space-y-3"': 'className="rounded-2xl border border-slate-200 bg-slate-50 p-4 space-y-4"',
            'className="w-full h-9 px-2.5 bg-white border border-slate-300 rounded-lg text-xs font-semibold text-slate-700 focus:outline-none focus:ring-2 focus:ring-emerald-500"': 'className="ui-control w-full px-3 bg-white border border-slate-300 rounded-xl text-sm font-semibold text-slate-800"',
            'className="w-full h-8 rounded-lg bg-white border border-slate-300 text-xs font-semibold text-slate-700 hover:bg-slate-100 transition cursor-pointer"': 'className="ui-control w-full rounded-xl bg-white border border-slate-300 text-sm font-semibold text-slate-700 hover:bg-slate-100 transition-colors cursor-pointer"',
            'className="flex-1 md:overflow-y-auto min-h-0 rounded-lg border border-slate-100 bg-white"': 'className="flex-1 md:overflow-y-auto min-h-0 rounded-2xl border border-slate-200 bg-white overflow-hidden"',
            'className="sm:hidden px-3 py-2.5"': 'className="sm:hidden px-4 py-3.5"',
            'className="mt-1 truncate text-xs font-medium leading-4 text-slate-700"': 'className="mt-1.5 truncate text-sm font-medium leading-5 text-slate-700"',
            'className="mt-1.5 flex items-center gap-1.5 min-w-0 text-xs leading-4 text-slate-400"': 'className="mt-2 flex items-center gap-1.5 min-w-0 text-xs leading-4 text-slate-500"',
            'className="mt-2.5 ml-6 border-l-2 border-slate-100 pl-3 py-0.5"': 'className="mt-3 ml-6 rounded-r-xl border-l-2 border-slate-200 bg-slate-50/70 pl-3 pr-3 py-3"',
            'className="grid grid-cols-[56px,1fr] gap-x-2 gap-y-1.5 text-xs leading-4"': 'className="grid grid-cols-[72px,1fr] gap-x-3 gap-y-2 text-xs leading-5"',
            'className="mt-2 flex items-center gap-1.5"': 'className="mt-3 flex flex-wrap items-center gap-2"',
            'className="inline-flex h-7 items-center gap-1 px-2 rounded-md border border-emerald-200 bg-emerald-50 text-xs font-semibold text-emerald-700"': 'className="inline-flex min-h-9 items-center gap-1.5 px-3 rounded-lg border border-emerald-200 bg-emerald-50 text-xs font-semibold text-emerald-800"',
            'className="inline-flex h-7 items-center gap-1 px-2 rounded-md border border-slate-200 bg-white text-xs font-semibold text-slate-600"': 'className="inline-flex min-h-9 items-center gap-1.5 px-3 rounded-lg border border-slate-200 bg-white text-xs font-semibold text-slate-700"',
            'className="inline-flex h-7 items-center gap-1 px-2 rounded-md border border-rose-200 bg-rose-50 text-xs font-semibold text-rose-700"': 'className="inline-flex min-h-9 items-center gap-1.5 px-3 rounded-lg border border-rose-200 bg-rose-50 text-xs font-semibold text-rose-700"',
            'className="hidden sm:flex items-center gap-1.5 px-2.5 sm:px-3 py-1.5 cursor-pointer"': 'className="hidden sm:flex items-center gap-2.5 px-4 py-3 cursor-pointer"',
            'className="flex-shrink-0 w-[120px] sm:w-[150px]"': 'className="flex-shrink-0 w-[132px] sm:w-[170px]"',
            'className="text-xs font-bold text-slate-700 leading-tight"': 'className="text-sm font-semibold text-slate-800 leading-tight"',
            'className="text-xs text-slate-400 font-mono flex items-center gap-0.5"': 'className="mt-1 text-xs text-slate-500 font-mono flex items-center gap-1"',
            'className="sm:hidden sticky top-0 z-10 bg-slate-50/95 backdrop-blur px-2 py-1 border-b border-slate-200 flex items-center justify-between text-xs text-slate-600"': 'className="sm:hidden sticky top-0 z-10 bg-white px-4 py-2.5 border-b border-slate-200 flex items-center justify-between text-xs text-slate-600"',
            'className="hidden sm:flex sticky top-0 z-10 bg-slate-100/95 backdrop-blur-xs px-3 py-1 border-b border-slate-200 items-center justify-between text-xs text-slate-600"': 'className="hidden sm:flex sticky top-0 z-10 bg-slate-50 px-4 py-2 border-b border-slate-200 items-center justify-between text-xs text-slate-600"',
            'className="sm:hidden flex flex-col items-center justify-center py-5 px-3 text-center"': 'className="sm:hidden flex flex-col items-center justify-center py-10 px-5 text-center"',
            'className="w-8 h-8 rounded-lg bg-slate-100 flex items-center justify-center mb-1.5"': 'className="w-10 h-10 rounded-xl bg-slate-100 flex items-center justify-center mb-2.5"',
            'className="mt-2 h-7 px-2.5 inline-flex items-center gap-1 rounded-md bg-slate-100 hover:bg-slate-200 text-xs font-semibold text-slate-700 transition cursor-pointer"': 'className="ui-control mt-3 px-3 inline-flex items-center gap-1.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-sm font-semibold text-slate-700 transition-colors cursor-pointer"',
          }

          for old, new in replacements.items():
              if old in text:
                  text = text.replace(old, new)

          # Add a calm section label above the scrollable history list without changing filter logic.
          anchor = '      {/* Scrollable Content Area - responsive height */}\n'
          if anchor in text and 'Arsip setoran' not in text:
              text = text.replace(anchor, '''      <div className="flex items-end justify-between gap-3 px-1 pt-1">\n        <div>\n          <h2 className="ui-section-title">Arsip setoran</h2>\n          <p className="ui-secondary mt-0.5">{displayedItems.length} rekaman · {activePeriodLabel}</p>\n        </div>\n        <span className="ui-meta hidden sm:inline">Klik baris untuk melihat detail</span>\n      </div>\n\n''' + anchor, 1)

          path.write_text(text)
          PY

          git diff -- src/components/HistoryTable.tsx
      - name: Install dependencies
        run: npm install --no-package-lock --ignore-scripts
      - name: TypeScript check
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: P2.5 finish gate
        shell: bash
        run: |
          set -euo pipefail
          file=src/components/HistoryTable.tsx
          grep -q 'Arsip setoran' "$file"
          grep -q 'Cari riwayat setoran' "$file"
          grep -q 'history-mobile-filter-panel' "$file"
          grep -q 'Unduh Laporan PDF' "$file"
          grep -q 'exportToCSV' "$file"
          grep -q 'confirmSingleDelete' "$file"
          grep -q 'confirmBatchDelete' "$file"
          grep -q 'openEditModal' "$file"
          grep -q 'useAccessibleDialog' "$file"
          grep -q "text: 'text-teal-800'" "$file" || grep -q 'text-teal-800' "$file"
          ! grep -q 'text-\[9px\]' "$file"
          ! grep -q 'text-\[10px\]' "$file"
          ! grep -q '{opt.emoji} {opt.label}' "$file"
          git diff --check
      - name: Commit verified P2.5 change
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/HistoryTable.tsx
          if ! git diff --cached --quiet; then
            git commit -m 'refactor: polish P2.5 HistoryTable hierarchy'
            git push
          fi
