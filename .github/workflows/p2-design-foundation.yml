name: P2 Design Foundation Gate

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/design-foundation.css'
      - 'src/app-shell.css'
      - 'src/dashboard-experience.css'
      - 'src/input-workflow.css'
      - 'src/history-experience.css'
      - 'src/motion-finish.css'
      - 'src/chrome-transition-fix.css'
      - 'src/setor-dropup.css'
      - 'src/design-system/**'
      - 'src/components/Navbar.tsx'
      - 'src/components/BottomNav.tsx'
      - 'src/components/UstadzDashboard.tsx'
      - 'src/components/WaliDashboard.tsx'
      - 'src/components/SantriDashboard.tsx'
      - 'src/components/ScrollReveal.tsx'
      - 'src/components/ZiyadahForm.tsx'
      - 'src/components/MurojaahForm.tsx'
      - 'src/components/BinnadzorForm.tsx'
      - 'src/components/PembelajaranForm.tsx'
      - 'src/components/SetoranFormNav.tsx'
      - 'src/components/SetorActionSheet.tsx'
      - 'src/components/ManageActionSheet.tsx'
      - 'src/components/HistoryTable.tsx'
      - 'src/hooks/useActiveTabNavigation.ts'
      - 'src/main.tsx'
      - 'tests/setor-dropup-source.test.mjs'
      - 'tests/navigation-jank-regression.test.mjs'
      - 'P2_DESIGN_FOUNDATION.md'
      - '.github/workflows/p2-design-foundation.yml'
  push:
    branches:
      - 'design/p2-*'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: TypeScript check
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Verify Setor, Kelola, and navigation regression contracts
        run: node --test tests/setor-dropup-source.test.mjs tests/navigation-jank-regression.test.mjs

      - name: Verify P2 accessibility contract
        run: |
          grep -q 'prefers-reduced-motion: reduce' src/design-foundation.css
          grep -q 'min-height: 44px' src/design-foundation.css
          grep -q 'forced-colors: active' src/design-foundation.css
          grep -q 'prefers-reduced-motion: reduce' src/app-shell.css
          grep -q 'forced-colors: active' src/app-shell.css
          grep -q 'prefers-reduced-motion: reduce' src/dashboard-experience.css
          grep -q 'forced-colors: active' src/dashboard-experience.css
          grep -q 'prefers-reduced-motion: reduce' src/input-workflow.css
          grep -q 'forced-colors: active' src/input-workflow.css
          grep -q 'prefers-reduced-motion: reduce' src/history-experience.css
          grep -q 'forced-colors: active' src/history-experience.css
          grep -q 'prefers-reduced-motion: reduce' src/motion-finish.css
          grep -q 'forced-colors: active' src/motion-finish.css
          grep -q 'prefers-reduced-motion: reduce' src/chrome-transition-fix.css
          grep -q 'forced-colors: active' src/chrome-transition-fix.css
          grep -q 'p2-dashboard-ustadz' src/components/UstadzDashboard.tsx
          grep -q 'p2-dashboard-wali' src/components/WaliDashboard.tsx
          grep -q 'p2-dashboard-santri' src/components/SantriDashboard.tsx
          grep -q 'ui-form-identity' src/components/ZiyadahForm.tsx
          grep -q 'ui-form-identity' src/components/MurojaahForm.tsx
          grep -q 'ui-form-identity' src/components/BinnadzorForm.tsx
          grep -q 'ui-form-identity' src/components/PembelajaranForm.tsx
          grep -q 'Navigasi form setoran' src/components/SetoranFormNav.tsx
          grep -q 'setor-action-sheet-title' src/components/SetorActionSheet.tsx
          grep -q 'p2-history' src/components/HistoryTable.tsx
          grep -q 'data-selected' src/components/HistoryTable.tsx

      - name: Verify P2 motion finish contract
        run: |
          grep -q 'startViewTransition' src/hooks/useActiveTabNavigation.ts
          grep -q 'flushSync' src/hooks/useActiveTabNavigation.ts
          grep -q 'transition.ready' src/hooks/useActiveTabNavigation.ts
          grep -q 'startLocalPageEntrance' src/hooks/useActiveTabNavigation.ts
          grep -q 'view-transition-name: p2-nav-active' src/chrome-transition-fix.css
          grep -q 'is-navigation-entering' src/chrome-transition-fix.css
          grep -q 'view-transition-old(root)' src/chrome-transition-fix.css
          if grep -q 'view-transition-name: p2-page' src/chrome-transition-fix.css; then
            echo 'Stage 2 page content must stay live; p2-page snapshots are not allowed.'
            exit 1
          fi
          grep -q 'p2-dialog-in' src/motion-finish.css
          grep -q 'p2-record-in' src/motion-finish.css
          MOTION_BYTES=$(wc -c < src/motion-finish.css)
          if [ "$MOTION_BYTES" -gt 45000 ]; then
            echo "P2 motion layer is too large: ${MOTION_BYTES} bytes"
            exit 1
          fi

      - name: Reject expensive global effects
        run: |
          if grep -Eq 'backdrop-filter|animation-iteration-count:[[:space:]]*infinite|filter:[[:space:]]*blur' src/design-foundation.css src/app-shell.css src/dashboard-experience.css src/input-workflow.css src/history-experience.css src/motion-finish.css src/chrome-transition-fix.css; then
            echo 'P2 visual system contains an expensive global effect.'
            exit 1
          fi
