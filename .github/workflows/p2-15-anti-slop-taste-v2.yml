name: P2.15 Anti-Slop + Taste Validation v2

on:
  push:
    branches:
      - p2-15-anti-slop-taste
    paths:
      - .github/workflows/p2-15-anti-slop-taste-v2.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: p2-15-anti-slop-taste
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Measure baseline bundle
        shell: bash
        run: |
          npm run build
          BASE_JS=$(find dist/assets -type f -name '*.js' -printf '%s\n' | awk '{s+=$1} END {print s+0}')
          BASE_CSS=$(find dist/assets -type f -name '*.css' -printf '%s\n' | awk '{s+=$1} END {print s+0}')
          echo "$BASE_JS" > /tmp/p2-15-base-js
          echo "$BASE_CSS" > /tmp/p2-15-base-css
          echo "Baseline JS bytes: $BASE_JS"
          echo "Baseline CSS bytes: $BASE_CSS"
          rm -rf dist

      - name: Apply P2.15 polish
        run: |
          python .github/p2-15-polish.py
          python .github/p2-15-solidify.py

      - name: TypeScript check
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Measure final bundle
        shell: bash
        run: |
          BASE_JS=$(cat /tmp/p2-15-base-js)
          BASE_CSS=$(cat /tmp/p2-15-base-css)
          FINAL_JS=$(find dist/assets -type f -name '*.js' -printf '%s\n' | awk '{s+=$1} END {print s+0}')
          FINAL_CSS=$(find dist/assets -type f -name '*.css' -printf '%s\n' | awk '{s+=$1} END {print s+0}')
          echo "Final JS bytes: $FINAL_JS (baseline $BASE_JS)"
          echo "Final CSS bytes: $FINAL_CSS (baseline $BASE_CSS)"
          find dist/assets -type f -name '*.js' -printf '%s %p\n' | sort -nr | head -5
          MAX_JS=$((BASE_JS + 20480))
          test "$FINAL_JS" -le "$MAX_JS"

      - name: P2.15 finish gate
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          files = [
              'src/App.tsx',
              'src/components/LoginModal.tsx',
              'src/components/ZiyadahProgressChart.tsx',
              'src/components/TrenHafalanBulananChart.tsx',
              'src/components/HafalanStatsChart.tsx',
              'src/components/BinnadzorForm.tsx',
              'src/components/PembelajaranForm.tsx',
              'src/components/HistoryTable.tsx',
              'src/components/SetorActionSheet.tsx',
          ]
          combined = '\n'.join(Path(f).read_text() for f in files)
          for token in ['Sparkles', 'text-[9px]', 'text-[10px]', 'text-[11px]', 'bg-gradient-to', 'backdrop-blur', 'Recharts Analytics']:
              assert token not in combined, f'legacy token remains: {token}'

          login = Path('src/components/LoginModal.tsx').read_text()
          assert 'shadow-2xl' not in login
          assert 'bg-emerald-950' in login
          assert 'storageService.authenticate' in login and 'onLoginSuccess' in login

          b = Path('src/components/BinnadzorForm.tsx').read_text()
          p = Path('src/components/PembelajaranForm.tsx').read_text()
          h = Path('src/components/HistoryTable.tsx').read_text()
          assert '{opt.emoji}' not in b
          assert '{opt.emoji}' not in p
          assert '{st.emoji}' not in p
          assert 'purple-' not in h
          for required in ['saveBinnadzor', 'onSuccess', 'onNotify']:
              assert required in b
          for required in ['savePembelajaran', 'onSuccess', 'onNotify']:
              assert required in p
          sheet = Path('src/components/SetorActionSheet.tsx').read_text()
          for required in ['setProgramLiburanActive', 'PantauanLiburanMonitorModal', 'useAccessibleDialog']:
              assert required in sheet
          app = Path('src/App.tsx').read_text()
          assert '<BottomNav' in app and '<Navbar' in app
          PY
          git diff --check
          git diff --exit-code -- package.json 2>/dev/null || { echo 'package.json changed unexpectedly'; exit 1; }

      - name: Commit verified P2.15 source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx src/components/LoginModal.tsx src/components/ZiyadahProgressChart.tsx src/components/TrenHafalanBulananChart.tsx src/components/HafalanStatsChart.tsx src/components/BinnadzorForm.tsx src/components/PembelajaranForm.tsx src/components/HistoryTable.tsx src/components/SetorActionSheet.tsx
          git diff --cached --quiet && { echo "No source changes to commit"; exit 1; }
          git commit -m "refactor: complete P2.15 anti-slop taste pass"
          git push origin HEAD:p2-15-anti-slop-taste
