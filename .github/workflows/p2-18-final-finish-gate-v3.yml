name: P2.18 Final Finish Gate v3

on:
  push:
    branches:
      - p2-18-final-finish-gate
    paths:
      - .github/workflows/p2-18-final-finish-gate-v3.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: p2-18-final-finish-gate
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Baseline build and measure
        shell: bash
        run: |
          npm run build
          TOTAL=$(find dist/assets -type f -name '*.js' -printf '%s\n' | awk '{s+=$1} END {print s+0}')
          ENTRY=$(node -e "const fs=require('fs');const h=fs.readFileSync('dist/index.html','utf8');const m=h.match(/<script[^>]+src=\"\/([^\"]+\.js)\"/);if(!m)process.exit(2);console.log(m[1])")
          ENTRY_BYTES=$(stat -c%s "dist/$ENTRY")
          ENTRY_GZIP=$(gzip -c "dist/$ENTRY" | wc -c)
          echo "$TOTAL" > /tmp/base-total
          echo "$ENTRY_BYTES" > /tmp/base-entry
          echo "$ENTRY_GZIP" > /tmp/base-gzip
          echo "Baseline total JS: $TOTAL"
          echo "Baseline entry JS: $ENTRY_BYTES"
          echo "Baseline entry gzip: $ENTRY_GZIP"
          rm -rf dist
      - name: Apply validated route split
        run: python .github/p2-18-patch.py
      - name: TypeScript check
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: Measure final bundle
        shell: bash
        run: |
          TOTAL=$(find dist/assets -type f -name '*.js' -printf '%s\n' | awk '{s+=$1} END {print s+0}')
          ENTRY=$(node -e "const fs=require('fs');const h=fs.readFileSync('dist/index.html','utf8');const m=h.match(/<script[^>]+src=\"\/([^\"]+\.js)\"/);if(!m)process.exit(2);console.log(m[1])")
          ENTRY_BYTES=$(stat -c%s "dist/$ENTRY")
          ENTRY_GZIP=$(gzip -c "dist/$ENTRY" | wc -c)
          BASE_TOTAL=$(cat /tmp/base-total)
          BASE_ENTRY=$(cat /tmp/base-entry)
          BASE_GZIP=$(cat /tmp/base-gzip)
          echo "Final total JS: $TOTAL (baseline $BASE_TOTAL)"
          echo "Final entry JS: $ENTRY_BYTES (baseline $BASE_ENTRY)"
          echo "Final entry gzip: $ENTRY_GZIP (baseline $BASE_GZIP)"
          echo "Largest final chunks:"
          find dist/assets -type f -name '*.js' -printf '%s %p\n' | sort -nr | head -12
          test "$TOTAL" -le $((BASE_TOTAL + 51200))
          test "$ENTRY_BYTES" -le $((BASE_ENTRY * 75 / 100))
      - name: P2.18 final static gate
        run: |
          python .github/p2-18-gate.py
          git diff --check
      - name: Commit verified App change
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx
          git diff --cached --quiet && { echo "No App change to commit"; exit 1; }
          git commit -m "perf: code-split P2.18 feature routes"
          git push origin HEAD:p2-18-final-finish-gate
