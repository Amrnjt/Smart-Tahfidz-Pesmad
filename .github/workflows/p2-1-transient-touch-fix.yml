name: P2.1 Transient Touch Fix

on:
  push:
    branches:
      - design/p2-1-app-shell
    paths:
      - '.github/workflows/p2-1-transient-touch-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: design/p2-1-app-shell

      - name: Apply touch target fix
        run: node scripts/p2-1-touch-target-fix.mjs

      - name: Commit fix
        run: |
          if git diff --quiet -- src/app-shell.css; then
            echo "No patch needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app-shell.css
          git commit -m "P2.1: enforce 44px desktop nav touch targets"
          git push origin HEAD:design/p2-1-app-shell
