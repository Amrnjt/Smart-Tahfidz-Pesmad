name: P2.3 Wali Dashboard Validation

on:
  push:
    branches: [p2-3-wali-dashboard]

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply P2.3 typing fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/components/WaliDashboard.tsx')
          text = path.read_text()
          old = """  const categoryRows: { category: ActivityCategory; count: number; latest?: WaliActivity }[] = [\n    { category: 'Ziyadah', count: santriZiyadah.length, latest: latestByCategory('Ziyadah') },\n    { category: \"Muroja'ah\", count: santriMurojaah.length, latest: latestByCategory(\"Muroja'ah\") },\n    { category: 'Binnadzor', count: santriBinnadzor.length, latest: latestByCategory('Binnadzor') },\n    { category: 'Pembelajaran', count: santriPembelajaran.length, latest: latestByCategory('Pembelajaran') }\n  ].filter(row => row.count > 0 || row.category !== 'Pembelajaran');\n"""
          new = """  const categoryRowsSource: { category: ActivityCategory; count: number; latest?: WaliActivity }[] = [\n    { category: 'Ziyadah', count: santriZiyadah.length, latest: latestByCategory('Ziyadah') },\n    { category: \"Muroja'ah\", count: santriMurojaah.length, latest: latestByCategory(\"Muroja'ah\") },\n    { category: 'Binnadzor', count: santriBinnadzor.length, latest: latestByCategory('Binnadzor') },\n    { category: 'Pembelajaran', count: santriPembelajaran.length, latest: latestByCategory('Pembelajaran') }\n  ];\n  const categoryRows = categoryRowsSource.filter(row => row.count > 0 || row.category !== 'Pembelajaran');\n"""
          if old in text:
              text = text.replace(old, new, 1)
          elif 'const categoryRowsSource:' not in text:
              raise SystemExit('categoryRows anchor not found')
          path.write_text(text)
          PY
      - name: Install dependencies
        run: npm install --no-package-lock --ignore-scripts
      - name: TypeScript check
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: P2.3 finish gate
        shell: bash
        run: |
          set -euo pipefail
          file=src/components/WaliDashboard.tsx
          grep -q 'Profil santri belum terhubung' "$file"
          grep -q 'Setoran terbaru' "$file"
          grep -q 'Catatan Ustadz' "$file"
          grep -q 'Perkembangan aktual' "$file"
          grep -q 'Tren Ziyadah' "$file"
          grep -q 'Riwayat terakhir per kategori' "$file"
          grep -q 'sort((a, b) => b.timestamp.localeCompare(a.timestamp))' "$file"
          grep -q 'const categoryRowsSource:' "$file"
          grep -q 'PantauanLiburanWaliSection' "$file"
          grep -q 'ZiyadahProgressChart' "$file"
          grep -q "setActiveTab('mushaf')" "$file"
          grep -q "setActiveTab('riwayat')" "$file"
          grep -q "text: 'text-teal-800'" "$file"
          ! grep -q 'Sparkles' "$file"
          ! grep -q 'bg-gradient' "$file"
          ! grep -q 'text-\[9px\]' "$file"
          ! grep -q 'text-\[10px\]' "$file"
          ! grep -q 'AnimatedCounter' "$file"
          git diff --check
      - name: Commit verified P2.3 change
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/WaliDashboard.tsx
          if ! git diff --cached --quiet; then
            git commit -m 'refactor: redesign P2.3 Wali dashboard'
            git push
          fi
