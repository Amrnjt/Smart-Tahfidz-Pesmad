name: P2.6 Setoran Forms Validation

on:
  push:
    branches: [p2-6-setoran-forms]

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply P2.6 form-system polish
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          files = [
              Path('src/components/ZiyadahForm.tsx'),
              Path('src/components/MurojaahForm.tsx'),
              Path('src/components/BinnadzorForm.tsx'),
              Path('src/components/PembelajaranForm.tsx'),
          ]

          common = {
              'max-w-3xl mx-auto': 'max-w-4xl mx-auto',
              'bg-white rounded-3xl p-5 sm:p-7 border border-slate-200/90 shadow-sm space-y-5': 'bg-white rounded-2xl p-5 sm:p-6 border border-slate-200 space-y-6',
              'text-[9px]': 'text-xs',
              'text-[10px]': 'text-xs',
              'text-[11px]': 'text-xs',
              '{opt.emoji} {opt.label}': '{opt.label}',
              'block text-xs font-bold text-slate-700 uppercase mb-1.5': 'block text-sm font-semibold text-slate-800 mb-2',
              'block text-xs font-bold text-slate-700 uppercase tracking-wider': 'block text-sm font-semibold text-slate-800',
              'block text-xs font-bold text-slate-700 uppercase tracking-wide': 'block text-sm font-semibold text-slate-800',
              'w-full py-3 px-3.5 bg-slate-50 border border-slate-300 rounded-xl text-sm font-semibold text-slate-800': 'ui-control w-full px-3.5 bg-white border border-slate-300 rounded-xl text-sm font-semibold text-slate-900',
              'w-full py-2.5 px-3.5 bg-slate-50 border border-slate-300 rounded-xl text-sm font-medium': 'ui-control w-full px-3.5 bg-white border border-slate-300 rounded-xl text-sm font-medium text-slate-900',
              'w-full py-2.5 px-3.5 bg-slate-50 border border-slate-300 rounded-xl text-sm font-semibold': 'ui-control w-full px-3.5 bg-white border border-slate-300 rounded-xl text-sm font-semibold text-slate-900',
              'w-full py-2.5 px-3.5 bg-slate-50 border border-slate-300 rounded-xl text-sm placeholder-slate-400': 'w-full min-h-28 py-3 px-3.5 bg-white border border-slate-300 rounded-xl text-sm leading-6 placeholder-slate-400',
              'flex items-center justify-end gap-3 pt-3 border-t border-slate-100': 'flex flex-col-reverse sm:flex-row sm:items-center sm:justify-end gap-2 sm:gap-3 pt-4 border-t border-slate-200',
              'px-3 py-2 rounded-lg text-slate-500 hover:text-slate-800 hover:bg-slate-100 font-semibold text-xs transition cursor-pointer flex items-center gap-1.5 disabled:opacity-50': 'ui-control w-full sm:w-auto px-4 rounded-xl border border-slate-200 bg-white text-slate-600 hover:text-slate-900 hover:bg-slate-50 font-semibold text-sm transition-colors cursor-pointer flex items-center justify-center gap-2 disabled:opacity-50',
              'font-bold text-xs transition flex items-center gap-2 cursor-pointer disabled:opacity-60 disabled:cursor-not-allowed': 'font-bold text-sm transition-colors flex items-center justify-center gap-2 cursor-pointer disabled:opacity-60 disabled:cursor-not-allowed min-h-11 w-full sm:w-auto',
          }

          for path in files:
              text = path.read_text()
              for old, new in common.items():
                  text = text.replace(old, new)

              # Calm, consistent header typography.
              text = text.replace('text-lg sm:text-xl font-bold text-slate-800', 'ui-section-title text-slate-900')
              text = text.replace('text-lg sm:text-xl font-bold text-slate-900', 'ui-section-title text-slate-900')

              # Shared section rhythm based on existing comments; no form logic changes.
              anchors = [
                  ('{/* Santri & Tanggal Setoran */}', 'Identitas & waktu', 'Pilih santri serta waktu setoran yang benar.'),
                  ('{/* Santri, Tanggal & Waktu */}', 'Identitas & waktu', 'Pilih santri serta waktu setoran yang benar.'),
                  ('{/* 2. Pilih Santri, Tanggal & Waktu */}', 'Identitas & waktu', 'Pilih santri serta waktu pencatatan pembelajaran.'),
              ]
              for anchor, title, desc in anchors:
                  if anchor in text and title not in text:
                      text = text.replace(anchor, f'''{anchor}\n          <div className="space-y-1">\n            <h4 className="text-sm font-bold text-slate-900">{title}</h4>\n            <p className="text-xs text-slate-500">{desc}</p>\n          </div>''', 1)

              # Material section labels per form.
              material_anchors = [
                  ('{/* Surah Selector */}', 'Materi setoran', 'Tentukan surah dan rentang ayat yang disetorkan.'),
                  ('{/* 3. Pilihan Mode Materi Binnadzor */}', 'Materi bacaan', 'Pilih cara pencatatan materi sesuai setoran santri.'),
                  ('{/* 1. Pemilihan Tipe Kelas Non-Tahfidz */}', 'Program pembelajaran', 'Pilih program yang sesuai dengan kelas dan kebutuhan santri.'),
              ]
              for anchor, title, desc in material_anchors:
                  if anchor in text and title not in text:
                      text = text.replace(anchor, f'''{anchor}\n          <div className="space-y-1">\n            <h4 className="text-sm font-bold text-slate-900">{title}</h4>\n            <p className="text-xs text-slate-500">{desc}</p>\n          </div>''', 1)

              # Mode selector / option cards should read as controls, not decorative tiles.
              text = text.replace('transition flex items-center justify-center gap-1.5 border cursor-pointer', 'transition-colors min-h-11 flex items-center justify-center gap-2 border cursor-pointer')
              text = text.replace('transition cursor-pointer flex items-start gap-3', 'transition-colors cursor-pointer flex items-start gap-3 min-h-24')

              # Replace broad decorative shadows/rings inside form selectors with restrained borders.
              text = text.replace(' shadow-xs', '')
              text = text.replace(' ring-2 ring-emerald-600/20', '')
              text = text.replace(' ring-2 ring-indigo-600/20', '')

              path.write_text(text)
          PY

          git diff -- src/components/ZiyadahForm.tsx src/components/MurojaahForm.tsx src/components/BinnadzorForm.tsx src/components/PembelajaranForm.tsx
      - name: Install dependencies
        run: npm install --no-package-lock --ignore-scripts
      - name: TypeScript check
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: P2.6 finish gate
        shell: bash
        run: |
          set -euo pipefail
          for file in src/components/ZiyadahForm.tsx src/components/MurojaahForm.tsx src/components/BinnadzorForm.tsx src/components/PembelajaranForm.tsx; do
            grep -q 'Identitas & waktu' "$file"
            grep -q 'onNotify' "$file"
            grep -q 'isSubmitting' "$file"
            grep -q 'handleReset' "$file"
            grep -q 'storageService.save' "$file"
            grep -q 'berhasil disimpan ke Cloud' "$file"
            grep -q 'belum tersimpan ke Cloud' "$file"
            ! grep -q 'text-\[9px\]' "$file"
            ! grep -q 'text-\[10px\]' "$file"
            ! grep -q 'text-\[11px\]' "$file"
            ! grep -q '{opt.emoji} {opt.label}' "$file"
          done
          grep -q 'bg-emerald-800' src/components/ZiyadahForm.tsx
          grep -q 'bg-teal-800' src/components/MurojaahForm.tsx
          grep -q 'indigo' src/components/BinnadzorForm.tsx
          grep -q 'amber' src/components/PembelajaranForm.tsx
          git diff --check
      - name: Commit verified P2.6 change
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/ZiyadahForm.tsx src/components/MurojaahForm.tsx src/components/BinnadzorForm.tsx src/components/PembelajaranForm.tsx
          if ! git diff --cached --quiet; then
            git commit -m 'refactor: polish P2.6 setoran form system'
            git push
          fi
