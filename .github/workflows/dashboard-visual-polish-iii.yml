name: Dashboard Visual Polish III Validation

on:
  push:
    branches:
      - dashboard-visual-polish-iii
    paths:
      - .github/workflows/dashboard-visual-polish-iii.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dashboard-visual-polish-iii
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Apply Visual Polish III
        run: python scripts/dashboard_visual_polish_iii.py

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: TypeScript check
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Visual Polish III finish gate
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('src/components/UstadzDashboard.tsx').read_text()
          required = [
            'sevenDayPulse',
            'Ritme 7 hari',
            'momentumLabel',
            'todayKurangCount',
            'todayMengulangCount',
            'openAnalytics',
            'dashboard-analytics',
            'buka analitik',
            "timeZone: 'Asia/Jakarta'",
          ]
          for token in required:
              assert token in text, f'missing {token}'
          for forbidden in ['bg-gradient-to-', 'backdrop-blur', 'Sparkles', 'text-[9px]', 'text-[10px]', 'text-[11px]']:
              assert forbidden not in text, f'forbidden {forbidden}'
          assert "setActiveTab('riwayat')" in text
          assert 'dailyBreakdownWithShare' in text
          assert 'latestTodayActivity' in text
          PY
          git diff --check

      - name: Commit verified dashboard source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/UstadzDashboard.tsx
          if git diff --cached --quiet; then
            echo "No source changes"
            exit 1
          fi
          git commit -m "refactor: apply Ustadz dashboard visual polish III"
          git push origin HEAD:dashboard-visual-polish-iii
