name: P3.0 Transient Surface Markers

on:
  push:
    branches:
      - polish/p3-0-legacy-surface-convergence
    paths:
      - '.github/workflows/p3-0-transient-surface-markers.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: polish/p3-0-legacy-surface-convergence

      - name: Apply P3.0 semantic markers
        run: node scripts/p3-0-surface-markers.mjs

      - name: Commit markers
        run: |
          if git diff --quiet -- src/components/SantriManagement.tsx src/components/KelasManagement.tsx src/components/MushafQuran.tsx; then
            echo "No marker patch needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/SantriManagement.tsx src/components/KelasManagement.tsx src/components/MushafQuran.tsx
          git commit -m "P3.0: mark legacy surfaces for release polish"
          git push origin HEAD:polish/p3-0-legacy-surface-convergence
