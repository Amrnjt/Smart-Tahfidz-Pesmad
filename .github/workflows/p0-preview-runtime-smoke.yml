name: P0 Preview Runtime Smoke

on:
  push:
    branches:
      - security/p0-auth-role-integration
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Smoke Vercel Preview
        env:
          PREVIEW_URL: https://smart-tahfidz-pesmad-git-security-p0-auth-c38723-pesmad-tahfidz.vercel.app
        run: bash scripts/smoke-preview.sh
