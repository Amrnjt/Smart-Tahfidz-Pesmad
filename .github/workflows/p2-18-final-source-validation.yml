name: P2.18 Stored Source Validation

on:
  push:
    branches:
      - p2-18-final-finish-gate
    paths:
      - .github/workflows/p2-18-final-source-validation.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: p2-18-final-finish-gate
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: TypeScript check
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: Verify stored bundle
        shell: bash
        run: |
          TOTAL=$(find dist/assets -type f -name '*.js' -printf '%s\n' | awk '{s+=$1} END {print s+0}')
          ENTRY=$(node -e "const fs=require('fs');const h=fs.readFileSync('dist/index.html','utf8');const m=h.match(/<script[^>]+src=\"\/([^\"]+\.js)\"/);if(!m)process.exit(2);console.log(m[1])")
          ENTRY_BYTES=$(stat -c%s "dist/$ENTRY")
          ENTRY_GZIP=$(gzip -c "dist/$ENTRY" | wc -c)
          echo "Stored total JS: $TOTAL bytes"
          echo "Stored entry JS: $ENTRY_BYTES bytes"
          echo "Stored entry gzip: $ENTRY_GZIP bytes"
          echo "Largest chunks:"
          find dist/assets -type f -name '*.js' -printf '%s %p\n' | sort -nr | head -12
          test "$TOTAL" -le 2550000
          test "$ENTRY_BYTES" -le 900000
          test "$ENTRY_GZIP" -le 250000
      - name: Final static gate
        run: |
          python .github/p2-18-gate.py
          git diff --check
