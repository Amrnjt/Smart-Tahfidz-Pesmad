name: P2.13 State System Validation v2

on:
  push:
    branches:
      - p2-13-state-system
    paths:
      - .github/workflows/p2-13-state-system-v2.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: p2-13-state-system
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Apply P2.13 state system
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64

          def replace(path, old, new, count=None):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'Pattern not found in {path}: {old[:180]!r}')
              text = text.replace(old, new) if count is None else text.replace(old, new, count)
              p.write_text(text)

          path = 'src/App.tsx'
          replace(path, "  const [isLoadingData, setIsLoadingData] = useState<boolean>(false);\n  const [isSyncing, setIsSyncing] = useState<boolean>(false);", "  const [syncState, setSyncState] = useState<'idle' | 'syncing' | 'success' | 'error'>('idle');\n  const isSyncing = syncState === 'syncing';")
          replace(path, "    setIsSyncing(true);", "    setSyncState('syncing');")
          replace(path, "      refreshData();\n      setSnack({\n        id: `sync-${Date.now()}`", "      refreshData();\n      setSyncState('success');\n      setSnack({\n        id: `sync-${Date.now()}`")
          replace(path, "      console.error(err);\n      refreshData();\n      setSnack({", "      console.error(err);\n      refreshData();\n      setSyncState('error');\n      setSnack({")
          replace(path, "    } finally {\n      setIsSyncing(false);\n    }", "    }")
          replace(path, "                  isLoading={isLoadingData}\n", "")
          replace(path, "                isLoading={isLoadingData}\n", "")

          anchor = "  const isSetorActive = ['ziyadah', 'murojaah', 'binnadzor', 'pembelajaran'].includes(activeTab);\n"
          addition = anchor + "\n  const syncStatusCopy =\n    syncState === 'syncing'\n      ? 'Memeriksa koneksi dan data Cloud...'\n      : syncState === 'success'\n      ? 'Cloud Firestore • sinkronisasi terakhir berhasil'\n      : syncState === 'error'\n      ? 'Cloud tidak terjangkau • cache lokal tetap tersedia'\n      : 'Cloud Firestore • status koneksi belum diverifikasi';\n  const syncStatusTone =\n    syncState === 'success'\n      ? 'ui-state-success'\n      : syncState === 'error'\n      ? 'ui-state-error'\n      : syncState === 'syncing'\n      ? 'ui-state-info'\n      : 'ui-state-neutral';\n"
          replace(path, anchor, addition, 1)

          old_footer = '                <div className="flex items-center gap-1.5 text-emerald-800 bg-emerald-50 px-2.5 py-1 rounded-full border border-emerald-200 text-[11px] font-semibold">\n                  <Cloud className="w-3.5 h-3.5 text-emerald-700" />\n                  <span>Cloud Firestore • Sinkronisasi Real-Time Multi-Device</span>\n                </div>'
          new_footer = '                <div\n                  role="status"\n                  aria-live="polite"\n                  aria-atomic="true"\n                  className={`ui-state-surface flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-semibold ${syncStatusTone}`}\n                >\n                  <Cloud className={`w-3.5 h-3.5 ${syncState === \'syncing\' ? \'animate-pulse\' : \'\'}`} aria-hidden="true" />\n                  <span>{syncStatusCopy}</span>\n                </div>'
          replace(path, old_footer, new_footer, 1)

          path = 'src/components/UstadzDashboard.tsx'
          replace(path, "import { DashboardSkeleton } from './SkeletonLoading';\n", "")
          replace(path, "  isLoading?: boolean;\n", "")
          replace(path, "  onOpenSetorMenu,\n  isLoading = false\n}) => {", "  onOpenSetorMenu\n}) => {")
          replace(path, "\n  if (isLoading) {\n    return <DashboardSkeleton />;\n  }\n", "\n")

          path = 'src/components/WaliDashboard.tsx'
          replace(path, "import { SantriWaliDashboardSkeleton } from './SkeletonLoading';\n", "")
          replace(path, "  isLoading?: boolean;\n", "")
          replace(path, "  setActiveTab,\n  isLoading = false,\n  onNotify\n}) => {", "  setActiveTab,\n  onNotify\n}) => {")
          replace(path, "\n  if (isLoading) {\n    return <SantriWaliDashboardSkeleton role=\"Wali\" />;\n  }\n", "\n")

          path = 'src/components/SantriDashboard.tsx'
          replace(path, "import { SantriWaliDashboardSkeleton } from './SkeletonLoading';\n", "")
          replace(path, "  isLoading?: boolean;\n", "")
          replace(path, "  setActiveTab,\n  isLoading = false\n}) => {", "  setActiveTab\n}) => {")
          replace(path, "\n  if (isLoading) {\n    return <SantriWaliDashboardSkeleton role=\"Santri\" />;\n  }\n", "\n")

          path = 'src/components/HistoryTable.tsx'
          replace(path, "import { TableSkeleton } from './SkeletonLoading';\n", "")
          replace(path, "  isLoading?: boolean;\n", "")
          replace(path, "  currentUser, ziyadahRecords, murojaahRecords, binnadzorRecords, pembelajaranRecords, onDataChanged, isLoading = false, santriList = [], onNotify\n}) => {", "  currentUser, ziyadahRecords, murojaahRecords, binnadzorRecords, pembelajaranRecords, onDataChanged, santriList = [], onNotify\n}) => {")
          replace(path, "\n  if (isLoading) return <TableSkeleton rows={7} />;\n", "\n")

          snack_b64 = ''
          toast_b64 = ''
          Path('src/components/Snackbar.tsx').write_bytes(base64.b64decode(snack_b64))
          Path('src/components/NotificationToastContainer.tsx').write_bytes(base64.b64decode(toast_b64))

          path = 'src/index.css'
          marker = ".ui-state-info {\n  color: var(--status-info);\n  background: var(--status-info-subtle);\n  border-color: color-mix(in srgb, var(--status-info) 25%, white);\n}\n"
          addition = marker + "\n.ui-state-neutral {\n  color: var(--status-neutral);\n  background: var(--status-neutral-subtle);\n  border-color: color-mix(in srgb, var(--status-neutral) 22%, white);\n}\n\n.ui-state-surface {\n  border-width: 1px;\n  border-style: solid;\n  border-radius: var(--radius-surface);\n}\n"
          replace(path, marker, addition, 1)

          skeleton = Path('src/components/SkeletonLoading.tsx')
          if not skeleton.exists():
              raise SystemExit('SkeletonLoading.tsx missing before cleanup')
          skeleton.unlink()
          PY

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: TypeScript check
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: P2.13 finish gate
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          app = Path('src/App.tsx').read_text()
          snack = Path('src/components/Snackbar.tsx').read_text()
          toast = Path('src/components/NotificationToastContainer.tsx').read_text()
          css = Path('src/index.css').read_text()
          dashboards = [Path('src/components/UstadzDashboard.tsx').read_text(), Path('src/components/WaliDashboard.tsx').read_text(), Path('src/components/SantriDashboard.tsx').read_text(), Path('src/components/HistoryTable.tsx').read_text()]
          assert 'isLoadingData' not in app
          assert "syncState === 'syncing'" in app
          assert 'Cloud tidak terjangkau • cache lokal tetap tersedia' in app
          assert 'status koneksi belum diverifikasi' in app
          assert 'Sinkronisasi Real-Time Multi-Device' not in app
          assert "role={snack.type === 'error' ? 'alert' : 'status'}" in snack
          assert 'Math.max(duration, 7000)' in snack
          assert 'min-h-11 min-w-11' in snack
          assert 'Diterima 10 menit yang lalu' not in toast
          assert 'formatTanggalLengkap(toast.data.timestamp)' in toast
          assert 'aria-live="polite"' in toast
          assert 'bg-gradient' not in toast
          assert 'text-[11px]' not in toast
          assert '.ui-state-neutral' in css and '.ui-state-surface' in css
          assert not Path('src/components/SkeletonLoading.tsx').exists()
          for text in dashboards:
              assert 'SkeletonLoading' not in text
              assert 'isLoading?: boolean' not in text
              assert 'if (isLoading)' not in text
          PY
          if git grep -n "SkeletonLoading" -- ':!package-lock.json'; then exit 1; fi
          git diff --check

      - name: Commit verified P2.13 source
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A src/App.tsx src/components src/index.css
          git commit -m "refactor: unify P2.13 application state system"
          git push origin HEAD:p2-13-state-system
