name: Remove Dashboard Activity Tables

on:
  push:
    branches:
      - remove-dashboard-activity-tables
    paths:
      - .github/workflows/remove-dashboard-activity-tables.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: remove-dashboard-activity-tables
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Remove requested dashboard sections
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('src/components/UstadzDashboard.tsx')
          text = path.read_text()

          old = "import { getClassGroup, isNonTahfidzClass } from '../utils/classUtils';\n"
          if old not in text:
              raise SystemExit('classUtils import not found')
          text = text.replace(old, '')

          old = '  onSelectSantriForZiyadah,\n'
          if old not in text:
              raise SystemExit('onSelectSantriForZiyadah destructure not found')
          text = text.replace(old, '')

          old = '  const latestActivities = activities.slice(0, 6);\n'
          if old not in text:
              raise SystemExit('latestActivities declaration not found')
          text = text.replace(old, '')

          activity_pattern = re.compile(
              r'\n      <ScrollReveal className="ui-panel overflow-hidden">.*?\n      </ScrollReveal>\n\n(?=      <ScrollReveal delay=\{80\} className="space-y-3">)',
              re.S,
          )
          text, count = activity_pattern.subn('\n', text, count=1)
          if count != 1:
              raise SystemExit(f'Expected to remove one Arus kegiatan section, removed {count}')

          operational_pattern = re.compile(
              r'\n      <ScrollReveal delay=\{80\} className="ui-panel overflow-hidden">.*?\n      </ScrollReveal>(?=\n    </div>\n  \);\n\};)',
              re.S,
          )
          text, count = operational_pattern.subn('', text, count=1)
          if count != 1:
              raise SystemExit(f'Expected to remove one Operasional santri section, removed {count}')

          path.write_text(text)
          PY

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: TypeScript check
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Finish gate
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('src/components/UstadzDashboard.tsx').read_text()
          assert 'Arus kegiatan' not in text
          assert 'Aktivitas terbaru' not in text
          assert 'Operasional santri' not in text
          assert 'Santri & setoran berikutnya' not in text
          assert 'latestActivities' not in text
          assert 'getClassGroup' not in text
          assert 'isNonTahfidzClass' not in text
          assert 'Status operasional' in text
          assert 'Analitik hafalan' in text
          assert 'Tindak lanjut setoran' in text
          PY
          git diff --check

      - name: Commit verified change
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/UstadzDashboard.tsx
          git commit -m "refactor: remove dashboard activity tables"
          git push origin HEAD:remove-dashboard-activity-tables
