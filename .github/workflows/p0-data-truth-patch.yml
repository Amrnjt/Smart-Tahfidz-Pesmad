            <CheckCircle2 className=\"w-4 h-4 text-emerald-600 flex-shrink-0\" />
          )}
          <span>{toastMessage}</span>
        </div>
      )}
""",
              'Pantauan truthful toast styling'
          )
          text = replace_once(
