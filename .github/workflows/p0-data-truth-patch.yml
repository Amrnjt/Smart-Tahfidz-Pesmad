name: P0 Data Truth Patch

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/p0-data-truth-patch.yml

permissions:
  contents: write

jobs:
  patch-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Harden staged patch script
        run: python3 .github/p0_fix.py

      - name: Apply P0 patch
        run: python3 .github/p0_patch.py

      - name: Validate build
        run: npm install --no-package-lock --ignore-scripts && npm run build && git diff --check

      - name: Commit P0 changes
        run: rm .github/p0_fix.py .github/p0_patch.py .github/workflows/p0-data-truth-patch.yml && git config user.name "github-actions[bot]" && git config user.email "41898282+github-actions[bot]@users.noreply.github.com" && git add -A && git commit -m "fix: enforce P0 data truth and reliability" && git push origin HEAD:main
