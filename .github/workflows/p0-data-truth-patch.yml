          replacement = """  const applyDatePreset = (preset: 'hari_ini' | '7_hari' | '30_hari' | 'bulan_ini' | 'semua') => {
    setActiveDatePreset(preset);
    const todayStr = getTodayInputFormat();

    if (preset === 'semua') {
