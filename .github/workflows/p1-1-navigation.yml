name: P1.1 Navigation Architecture

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/p1-1-navigation.yml

permissions:
  contents: write

jobs:
  patch-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Apply patch
        run: python3 .github/p1_1_patch.py

      - name: Validate build
        run: |
          npm install --no-package-lock --ignore-scripts
          npm run build
          git diff --check

      - name: Commit verified change
        run: |
          rm .github/p1_1_patch.py
          rm .github/workflows/p1-1-navigation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: simplify P1.1 navigation architecture"
          git push origin HEAD:main
