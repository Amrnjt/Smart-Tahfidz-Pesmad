name: P2.13 State System Validation

on:
  push:
    branches:
      - p2-13-state-system
    paths:
      - .github/workflows/p2-13-state-system.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: p2-13-state-system
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Apply P2.13 state system
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=None):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'Pattern not found in {path}: {old[:180]!r}')
              text = text.replace(old, new) if count is None else text.replace(old, new, count)
              p.write_text(text)

          # App: remove dead global loading state and make Cloud status factual.
          path = 'src/App.tsx'
          replace(path,
              "  const [isLoadingData, setIsLoadingData] = useState<boolean>(false);\n  const [isSyncing, setIsSyncing] = useState<boolean>(false);",
              "  const [syncState, setSyncState] = useState<'idle' | 'syncing' | 'success' | 'error'>('idle');\n  const isSyncing = syncState === 'syncing';")
          replace(path, "    setIsSyncing(true);", "    setSyncState('syncing');")
          replace(path,
              "      refreshData();\n      setSnack({\n        id: `sync-${Date.now()}`",
              "      refreshData();\n      setSyncState('success');\n      setSnack({\n        id: `sync-${Date.now()}`")
          replace(path,
              "      console.error(err);\n      refreshData();\n      setSnack({",
              "      console.error(err);\n      refreshData();\n      setSyncState('error');\n      setSnack({")
          replace(path,
              "    } finally {\n      setIsSyncing(false);\n    }",
              "    }")
          replace(path, "                  isLoading={isLoadingData}\n", "")
          replace(path, "                isLoading={isLoadingData}\n", "")

          anchor = "  const isSetorActive = ['ziyadah', 'murojaah', 'binnadzor', 'pembelajaran'].includes(activeTab);\n"
          addition = anchor + "\n  const syncStatusCopy =\n    syncState === 'syncing'\n      ? 'Memeriksa koneksi dan data Cloud...'\n      : syncState === 'success'\n      ? 'Cloud Firestore • sinkronisasi terakhir berhasil'\n      : syncState === 'error'\n      ? 'Cloud tidak terjangkau • cache lokal tetap tersedia'\n      : 'Cloud Firestore • status koneksi belum diverifikasi';\n  const syncStatusTone =\n    syncState === 'success'\n      ? 'ui-state-success'\n      : syncState === 'error'\n      ? 'ui-state-error'\n      : syncState === 'syncing'\n      ? 'ui-state-info'\n      : 'ui-state-neutral';\n"
          replace(path, anchor, addition, 1)

          old_footer = '''                <div className="flex items-center gap-1.5 text-emerald-800 bg-emerald-50 px-2.5 py-1 rounded-full border border-emerald-200 text-[11px] font-semibold">
                  <Cloud className="w-3.5 h-3.5 text-emerald-700" />
                  <span>Cloud Firestore • Sinkronisasi Real-Time Multi-Device</span>
                </div>'''
          new_footer = '''                <div
                  role="status"
                  aria-live="polite"
                  aria-atomic="true"
                  className={`ui-state-surface flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-semibold ${syncStatusTone}`}
                >
                  <Cloud className={`w-3.5 h-3.5 ${syncState === 'syncing' ? 'animate-pulse' : ''}`} aria-hidden="true" />
                  <span>{syncStatusCopy}</span>
                </div>'''
          replace(path, old_footer, new_footer, 1)

          # Dashboards: local-first data renders immediately; remove unreachable blocking skeleton state.
          path = 'src/components/UstadzDashboard.tsx'
          replace(path, "import { DashboardSkeleton } from './SkeletonLoading';\n", "")
          replace(path, "  isLoading?: boolean;\n", "")
          replace(path, "  onOpenSetorMenu,\n  isLoading = false\n}) => {", "  onOpenSetorMenu\n}) => {")
          replace(path, "\n  if (isLoading) {\n    return <DashboardSkeleton />;\n  }\n", "\n")

          path = 'src/components/WaliDashboard.tsx'
          replace(path, "import { SantriWaliDashboardSkeleton } from './SkeletonLoading';\n", "")
          replace(path, "  isLoading?: boolean;\n", "")
          replace(path, "  setActiveTab,\n  isLoading = false,\n  onNotify\n}) => {", "  setActiveTab,\n  onNotify\n}) => {")
          replace(path, "\n  if (isLoading) {\n    return <SantriWaliDashboardSkeleton role=\"Wali\" />;\n  }\n", "\n")

          path = 'src/components/SantriDashboard.tsx'
          replace(path, "import { SantriWaliDashboardSkeleton } from './SkeletonLoading';\n", "")
          replace(path, "  isLoading?: boolean;\n", "")
          replace(path, "  setActiveTab,\n  isLoading = false\n}) => {", "  setActiveTab\n}) => {")
          replace(path, "\n  if (isLoading) {\n    return <SantriWaliDashboardSkeleton role=\"Santri\" />;\n  }\n", "\n")

          path = 'src/components/HistoryTable.tsx'
          replace(path, "import { TableSkeleton } from './SkeletonLoading';\n", "")
          replace(path, "  isLoading?: boolean;\n", "")
          replace(path,
              "  currentUser, ziyadahRecords, murojaahRecords, binnadzorRecords, pembelajaranRecords, onDataChanged, isLoading = false, santriList = [], onNotify\n}) => {",
              "  currentUser, ziyadahRecords, murojaahRecords, binnadzorRecords, pembelajaranRecords, onDataChanged, santriList = [], onNotify\n}) => {")
          replace(path, "\n  if (isLoading) return <TableSkeleton rows={7} />;\n", "\n")

          # Feedback surface: semantic, accessible, calm and action-oriented.
          Path('src/components/Snackbar.tsx').write_text('''import React, { useCallback, useEffect, useState } from 'react';
import { AlertCircle, CheckCircle2, Info, X } from 'lucide-react';

export type SnackbarKind = 'success' | 'error' | 'info';

export interface SnackbarActionOptions {
  actionLabel?: string;
  onAction?: () => void;
}

export type NotifyFn = (type: SnackbarKind, message: string, options?: SnackbarActionOptions) => void;

export interface SnackbarState {
  id: string;
  message: string;
  type: SnackbarKind;
  actionLabel?: string;
  onAction?: () => void;
}

interface SnackbarProps {
  snack: SnackbarState | null;
  onDismiss: () => void;
  duration?: number;
}

const toneByType: Record<SnackbarKind, { state: string; icon: string }> = {
  success: { state: 'ui-state-success', icon: 'text-emerald-700' },
  error: { state: 'ui-state-error', icon: 'text-rose-700' },
  info: { state: 'ui-state-info', icon: 'text-sky-700' }
};

export const Snackbar: React.FC<SnackbarProps> = ({ snack, onDismiss, duration = 4000 }) => {
  const [isExiting, setIsExiting] = useState(false);

  const dismiss = useCallback(() => {
    setIsExiting(true);
    setTimeout(() => {
      onDismiss();
      setIsExiting(false);
    }, 150);
  }, [onDismiss]);

  useEffect(() => {
    if (!snack) return;
    const effectiveDuration = snack.type === 'error' || snack.actionLabel ? Math.max(duration, 7000) : duration;
    const timer = setTimeout(dismiss, effectiveDuration);
    return () => clearTimeout(timer);
  }, [snack, duration, dismiss]);

  if (!snack) return null;

  const tone = toneByType[snack.type];
  const Icon = snack.type === 'success' ? CheckCircle2 : snack.type === 'error' ? AlertCircle : Info;

  return (
    <div className="fixed bottom-20 md:bottom-6 left-1/2 -translate-x-1/2 z-[70] w-[calc(100%-2rem)] max-w-lg pointer-events-none">
      <div
        role={snack.type === 'error' ? 'alert' : 'status'}
        aria-live={snack.type === 'error' ? 'assertive' : 'polite'}
        aria-atomic="true"
        className={`ui-state-surface pointer-events-auto flex items-center gap-3 px-3 py-2 rounded-xl shadow-lg ${tone.state} ${isExiting ? 'snackbar-exit' : 'snackbar-enter'}`}
      >
        <Icon className={`w-5 h-5 flex-shrink-0 ${tone.icon}`} aria-hidden="true" />
        <span className="text-sm font-medium leading-5 flex-1">{snack.message}</span>
        {snack.actionLabel && snack.onAction && (
          <button
            type="button"
            onClick={() => { snack.onAction?.(); dismiss(); }}
            className="min-h-11 px-3 rounded-lg border border-current/20 bg-white/70 text-sm font-semibold hover:bg-white transition-colors cursor-pointer flex-shrink-0"
          >
            {snack.actionLabel}
          </button>
        )}
        <button
          type="button"
          onClick={dismiss}
          className="min-h-11 min-w-11 inline-flex items-center justify-center rounded-lg hover:bg-white/70 transition-colors cursor-pointer flex-shrink-0"
          aria-label="Tutup pemberitahuan"
        >
          <X className="w-4 h-4" aria-hidden="true" />
        </button>
      </div>
    </div>
  );
};
''')

          # Wali domain notification remains distinct from action Snackbar, but shares state discipline.
          Path('src/components/NotificationToastContainer.tsx').write_text('''import React, { useEffect } from 'react';
import { Bell, BookOpen, RotateCw, X } from 'lucide-react';
import { ToastNotification } from '../hooks/useSetoranNotifications';
import { formatTanggalLengkap } from '../utils/dateFormatter';

interface NotificationToastContainerProps {
  toasts: ToastNotification[];
  onDismiss: (id: string) => void;
}

export const NotificationToastContainer: React.FC<NotificationToastContainerProps> = ({
  toasts,
  onDismiss
}) => {
  useEffect(() => {
    const timers = toasts.map(t => setTimeout(() => onDismiss(t.id), 15000));
    return () => timers.forEach(clearTimeout);
  }, [toasts, onDismiss]);

  if (toasts.length === 0) return null;

  return (
    <div
      className="fixed top-4 right-4 z-[60] flex flex-col gap-3 max-w-sm w-[calc(100%-2rem)] sm:w-96"
      aria-live="polite"
      aria-relevant="additions"
    >
      {toasts.map(toast => {
        const isZiyadah = toast.data.type === 'Ziyadah';
        const TypeIcon = isZiyadah ? BookOpen : RotateCw;
        const typeTone = isZiyadah
          ? 'border-emerald-200 bg-emerald-50 text-emerald-800'
          : 'border-teal-200 bg-teal-50 text-teal-800';

        return (
          <div
            key={toast.id}
            role="status"
            className="overflow-hidden rounded-xl border border-slate-200 bg-white shadow-lg"
          >
            <div className="flex items-start justify-between gap-3 border-b border-slate-200 px-4 py-3">
              <div className="flex items-start gap-3 min-w-0">
                <div className="flex h-10 w-10 flex-shrink-0 items-center justify-center rounded-lg border border-slate-200 bg-slate-50 text-slate-700">
                  <Bell className="h-4 w-4" aria-hidden="true" />
                </div>
                <div className="min-w-0">
                  <p className="text-xs font-semibold text-slate-500">Notifikasi setoran</p>
                  <h4 className="mt-0.5 text-sm font-bold leading-5 text-slate-900">
                    {toast.title}
                  </h4>
                  <p className="mt-1 text-xs leading-4 text-slate-500">
                    Waktu setoran: {formatTanggalLengkap(toast.data.timestamp)}
                  </p>
                </div>
              </div>
              <button
                type="button"
                onClick={() => onDismiss(toast.id)}
                className="min-h-11 min-w-11 inline-flex items-center justify-center rounded-lg text-slate-500 hover:bg-slate-100 hover:text-slate-800 transition-colors cursor-pointer flex-shrink-0"
                aria-label="Tutup notifikasi setoran"
              >
                <X className="w-4 h-4" aria-hidden="true" />
              </button>
            </div>

            <div className="p-4 space-y-3">
              <div className={`inline-flex items-center gap-1.5 rounded-lg border px-2.5 py-1 text-xs font-semibold ${typeTone}`}>
                <TypeIcon className="w-3.5 h-3.5" aria-hidden="true" />
                {toast.data.type}
              </div>

              <dl className="grid grid-cols-[64px,1fr] gap-x-3 gap-y-2 text-sm">
                <dt className="text-slate-500">Materi</dt>
                <dd className="font-semibold text-slate-800 break-words">{toast.data.materi}</dd>
                <dt className="text-slate-500">Nilai</dt>
                <dd className="font-semibold text-slate-800">{toast.data.nilai}</dd>
                <dt className="text-slate-500">Penginput</dt>
                <dd className="text-slate-700 break-words">{toast.data.inputBy || 'Tidak tercatat'}</dd>
                <dt className="text-slate-500">Catatan</dt>
                <dd className="text-slate-700 break-words">{toast.data.catatan || 'Tidak ada catatan.'}</dd>
              </dl>
            </div>
          </div>
        );
      })}
    </div>
  );
};
''')

          # Complete the semantic state primitives established in P2.1.
          path = 'src/index.css'
          marker = '''.ui-state-info {
  color: var(--status-info);
  background: var(--status-info-subtle);
  border-color: color-mix(in srgb, var(--status-info) 25%, white);
}
'''
          addition = marker + '''
.ui-state-neutral {
  color: var(--status-neutral);
  background: var(--status-neutral-subtle);
  border-color: color-mix(in srgb, var(--status-neutral) 22%, white);
}

.ui-state-surface {
  border-width: 1px;
  border-style: solid;
  border-radius: var(--radius-surface);
}
'''
          replace(path, marker, addition, 1)

          # The old blocking skeleton layer has no truthful runtime consumer in the local-first architecture.
          skeleton = Path('src/components/SkeletonLoading.tsx')
          if not skeleton.exists():
              raise SystemExit('SkeletonLoading.tsx missing before P2.13 cleanup')
          skeleton.unlink()
          PY

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: TypeScript check
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: P2.13 finish gate
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          app = Path('src/App.tsx').read_text()
          snack = Path('src/components/Snackbar.tsx').read_text()
          toast = Path('src/components/NotificationToastContainer.tsx').read_text()
          css = Path('src/index.css').read_text()
          dashboards = [
              Path('src/components/UstadzDashboard.tsx').read_text(),
              Path('src/components/WaliDashboard.tsx').read_text(),
              Path('src/components/SantriDashboard.tsx').read_text(),
              Path('src/components/HistoryTable.tsx').read_text(),
          ]

          assert 'isLoadingData' not in app
          assert 'setIsLoadingData' not in app
          assert "syncState === 'syncing'" in app
          assert 'Cloud tidak terjangkau • cache lokal tetap tersedia' in app
          assert 'status koneksi belum diverifikasi' in app
          assert 'Sinkronisasi Real-Time Multi-Device' not in app
          assert 'role="status"' in app and 'aria-live="polite"' in app

          assert "role={snack.type === 'error' ? 'alert' : 'status'}" in snack
          assert "Math.max(duration, 7000)" in snack
          assert 'min-h-11 min-w-11' in snack
          assert 'ui-state-surface' in snack

          assert 'Diterima 10 menit yang lalu' not in toast
          assert 'formatTanggalLengkap(toast.data.timestamp)' in toast
          assert 'aria-live="polite"' in toast
          assert 'min-h-11 min-w-11' in toast
          assert 'bg-gradient' not in toast
          assert 'text-[11px]' not in toast

          assert '.ui-state-neutral' in css
          assert '.ui-state-surface' in css
          assert not Path('src/components/SkeletonLoading.tsx').exists()
          for text in dashboards:
              assert 'SkeletonLoading' not in text
              assert 'isLoading?: boolean' not in text
              assert 'if (isLoading)' not in text
          PY
          ! git grep -n "SkeletonLoading" -- ':!package-lock.json'
          git diff --check

      - name: Commit verified P2.13 source
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx src/components/Snackbar.tsx src/components/NotificationToastContainer.tsx src/components/UstadzDashboard.tsx src/components/WaliDashboard.tsx src/components/SantriDashboard.tsx src/components/HistoryTable.tsx src/components/SkeletonLoading.tsx src/index.css
          git commit -m "refactor: unify P2.13 application state system"
          git push origin HEAD:p2-13-state-system
